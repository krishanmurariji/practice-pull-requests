<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<style>
  /* =====================================================================
     RECRUITMENT PIPELINE
     1. summary header (one recruitment, in a few lines)
     2. a thin line, then the toolbar
     3. the board: one lane per stage, drag cards between lanes
     ===================================================================== */
  .rhead { padding: 1rem 1.25rem 1rem; margin-bottom: 0; transition: padding 0.3s ease; }
  .rhead.min { padding-bottom: 0.75rem; }
  /* the details fold away completely: only the title row stays */
  .rbody { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.35s ease, opacity 0.25s ease; }
  .rbody > .rin { overflow: hidden; min-height: 0; }
  .rhead.min .rbody { grid-template-rows: 0fr; opacity: 0; }
  .pmin .lane-cards { max-height: calc(100vh - 12rem); }
  .pmin .bline { margin-top: 0.6rem; }
  /* previous / next pipeline, and the details switch */
  .flip { display: inline-flex; align-items: center; gap: 0.125rem; border: 1px solid var(--line); border-radius: 6.1875rem; padding: 0.125rem; background: var(--surface); }
  .flip button { width: 1.875rem; height: 1.875rem; border: 0; border-radius: 50%; background: none; color: var(--ink-2); display: grid; place-items: center; transition: background 0.15s, color 0.15s, transform 0.15s; }
  .flip button:hover { background: var(--brand-soft); color: var(--brand); }
  .flip button:active { transform: scale(0.9); }
  .flip .cnt { min-width: 3rem; text-align: center; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .dsw { display: inline-flex; align-items: center; gap: 0.5rem; height: 2.25rem; padding: 0 0.75rem 0 0.875rem; border: 1px solid var(--line); border-radius: 6.1875rem; background: var(--surface); font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
  .dsw:hover { background: var(--surface-2); }
  .dsw .switch { width: 2.125rem; height: 1.25rem; }
  .dsw .switch span::after { width: 0.875rem; height: 0.875rem; }
  .dsw .switch input:checked + span::after { transform: translateX(0.875rem); }
  .rh-sep { width: 1px; height: 1.5rem; background: var(--line); margin: 0 0.25rem; }
  .slide-r { animation: slideR 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .slide-l { animation: slideL 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes slideR { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
  @keyframes slideL { from { opacity: 0; transform: translateX(-1.5rem); } to { opacity: 1; transform: none; } }
  /* details */
  .lipill { display: inline-flex; align-items: center; gap: 0.4375rem; padding: 0.1875rem 0.6875rem 0.1875rem 0.4375rem; border-radius: 6.1875rem; background: #eaf3fc; color: #0a66c2; font-weight: 600; font-size: var(--fs-xs); border: 1px solid transparent; }
  .lipill.off { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-3); cursor: pointer; }
  .lipill.off:hover { color: #0a66c2; border-color: #0a66c2; }
  .cdate { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.1875rem 0.625rem; border-radius: 6.1875rem; background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-xs); font-weight: 600; }
  .cdate.soon { background: var(--warn-soft); color: var(--warn); }
  .cdate svg.i { width: 0.8125rem; height: 0.8125rem; }
  .rgrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1rem 2.25rem; margin-top: 1rem; }
  @media (max-width: 960px) { .rgrid { grid-template-columns: minmax(0, 1fr); } }
  .rsec + .rsec { margin-top: 0.875rem; }
  .rsec h5 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; margin: 0 0 0.4375rem; display: flex; align-items: center; gap: 0.5rem; }
  .jd { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.6; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; white-space: pre-line; }
  .jd.open { -webkit-line-clamp: unset; }
  .jdmore { border: 0; background: none; padding: 0; margin-top: 0.1875rem; color: var(--brand); font-size: var(--fs-xs); font-weight: 600; }
  .skl { display: flex; flex-wrap: wrap; gap: 0.3125rem; }
  .skl .tag { font-size: var(--fs-xs); padding: 0.1875rem 0.625rem; background: var(--brand-soft); color: var(--brand); font-weight: 600; border-radius: 6.1875rem; }
  .pplist { display: flex; flex-wrap: wrap; gap: 0.375rem; }
  .pp { display: inline-flex; align-items: center; gap: 0.4375rem; padding: 0.125rem 0.6875rem 0.125rem 0.125rem; border: 1px solid var(--line); border-radius: 6.1875rem; font-size: var(--fs-sm); background: var(--surface); }
  .pp .av { --s: 1.5rem; }
  .pp small { color: var(--ink-3); font-size: var(--fs-xs); }
  .rh-top { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; }
  .rsel { display: inline-flex; align-items: center; gap: 0.4rem; max-width: 100%; border: 0; background: none; padding: 0.125rem 0.5rem 0.125rem 0; border-radius: 0.5rem; font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.015em; color: var(--ink); }
  .rsel .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rsel svg.i { width: 0.9rem; height: 0.9rem; color: var(--ink-3); transition: transform 0.15s; }
  .rsel:hover, .rsel.open { color: var(--brand); }
  .rsel.open svg.i { transform: rotate(180deg); }
  .li { width: 1.125rem; height: 1.125rem; flex: none; display: block; }
  .rh-acts { margin-left: auto; display: flex; gap: 0.375rem; align-items: center; }
  .rh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.875rem; margin-top: 0.25rem; font-size: var(--fs-xs); color: var(--ink-3); }
  .rh-meta span { display: inline-flex; align-items: center; gap: 0.3125rem; }
  .rh-meta svg.i { width: 0.8125rem; height: 0.8125rem; }
  .rh-meta .soon { color: var(--warn); font-weight: 600; }
  .rh-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 0; margin-top: 0.875rem; }
  .st1 { padding: 0 1.375rem; border-left: 1px solid var(--line); line-height: 1.2; }
  .st1:first-child { padding-left: 0; border-left: 0; }
  .st1 b { display: block; font-size: 1.2rem; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .st1 span { font-size: var(--fs-xs); color: var(--ink-3); }
  .st1.vac { min-width: 12.5rem; }
  .st1.vac .bar { margin: 0.3125rem 0 0.1875rem; height: 0.4375rem; }
  .st1.mg { display: flex; align-items: center; gap: 0.5rem; }
  .funnel { display: flex; gap: 2px; height: 0.4375rem; margin-top: 0.95rem; border-radius: 6.1875rem; overflow: hidden; background: var(--surface-2); }
  .funnel i { display: block; transition: flex 0.35s ease; cursor: pointer; }
  .funnel i:hover { filter: brightness(0.92); }
  .flegend { display: flex; flex-wrap: wrap; gap: 0.125rem 0.375rem; margin-top: 0.5rem; }
  .flegend button { display: inline-flex; align-items: center; gap: 0.375rem; border: 0; background: none; padding: 0.125rem 0.4375rem; border-radius: 6.1875rem; font-size: var(--fs-xs); color: var(--ink-2); }
  .flegend button:hover { background: var(--surface-2); }
  .flegend i { width: 0.5rem; height: 0.5rem; border-radius: 50%; }
  .flegend b { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
  .closed-note { margin-top: 0.75rem; display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0.75rem; border-radius: 0.625rem; background: var(--warn-soft); color: var(--warn); font-size: var(--fs-sm); }

  .bline { height: 1px; background: var(--line); margin: 0.9rem 0 0.75rem; }
  .tools { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .tools .grow { flex: 1 1 auto; }
  .rejtog { display: inline-flex; align-items: center; gap: 0.375rem; height: 2.25rem; padding: 0 0.75rem; border-radius: 0.625rem; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
  .rejtog:hover { background: var(--surface-2); color: var(--ink); }
  .rejtog.on { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .rejtog .n { font-size: var(--fs-xs); opacity: 0.8; }

  /* ---- board ---- */
  .board { display: flex; gap: 0.75rem; overflow-x: auto; padding: 0 0 0.75rem; align-items: flex-start; min-height: 18rem; }
  .lane { flex: 0 0 17rem; background: var(--surface-2); border-radius: var(--radius-lg); padding: 0.5rem; min-height: 14rem; min-width: 0; display: flex; flex-direction: column; transition: outline-color 0.15s, background 0.15s, opacity 0.15s; outline: 2px dashed transparent; outline-offset: -2px; }
  .lane.over { outline-color: var(--brand); background: color-mix(in srgb, var(--brand) 7%, var(--surface-2)); }
  .lane.lane-drag { opacity: 0.4; }
  .lane.stage-over { outline-color: var(--ink-3); }
  .lane-head { display: flex; align-items: center; gap: 0.4375rem; padding: 0.25rem 0.125rem 0.5rem 0.375rem; cursor: grab; border-radius: 0.5rem; }
  .lane-head:active { cursor: grabbing; }
  .lane-head .dot { width: 0.625rem; height: 0.625rem; border-radius: 0.1875rem; flex: none; }
  .lane-head b { font-size: var(--fs-md); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-head .n { font-size: var(--fs-xs); background: var(--surface); color: var(--ink-2); padding: 1px 0.5rem; border-radius: 6.1875rem; font-variant-numeric: tabular-nums; flex: none; }
  .lane-head .lm { margin-left: auto; display: inline-flex; align-items: center; gap: 0.125rem; flex: none; }
  .lane-head .lm .av-stack { opacity: 0; max-width: 0; overflow: hidden; transition: opacity 0.2s, max-width 0.25s; }
  .lane:hover .lm .av-stack { opacity: 1; max-width: 6rem; }
  .lane-head .icon-btn { width: 1.625rem; height: 1.625rem; opacity: 0; transition: opacity 0.15s; }
  .lane:hover .lane-head .icon-btn, .lane-head .icon-btn.open, .lane-head .icon-btn:focus-visible { opacity: 1; }
  .lane-cards { overflow-y: auto; max-height: calc(100vh - 22rem); min-height: 4rem; padding: 2px; margin: -2px; scrollbar-width: thin; flex: 1 1 auto; }
  .lane-empty { text-align: center; color: var(--ink-3); font-size: var(--fs-xs); padding: 1.5rem 0.5rem; border: 1.5px dashed var(--line); border-radius: 0.75rem; margin: 2px; }
  .lane-more { width: 100%; margin-top: 0.125rem; border: 0; background: none; color: var(--brand); font-size: var(--fs-xs); font-weight: 600; padding: 0.4375rem; border-radius: 0.5rem; }
  .lane-more:hover { background: var(--surface); }
  .lane.rej { background: color-mix(in srgb, var(--bad-soft) 55%, var(--surface-2)); }
  .lane.mini { flex-basis: 3.125rem; cursor: pointer; }
  .lane.mini .lane-head { flex-direction: column; padding: 0.5rem 0; gap: 0.5rem; cursor: pointer; }
  .lane.mini .lane-head b { writing-mode: vertical-rl; }
  .lane.mini .lane-cards, .lane.mini .lm, .lane.mini .icon-btn { display: none; }

  /* ---- candidate card ---- */
  .pcard { position: relative; padding: 0.6875rem 0.75rem 0.5625rem; margin-bottom: 0.4375rem; border-radius: 0.75rem; cursor: grab; user-select: none; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s; }
  .pcard:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); box-shadow: 0 0.375rem 1rem color-mix(in srgb, var(--brand) 11%, transparent); }
  .pcard.sel { border-color: var(--brand); background: var(--brand-soft); }
  .pcard .top { display: flex; align-items: center; gap: 0.625rem; margin-bottom: 0; }
  .pcard .who { display: block; flex: 1 1 auto; min-width: 0; }
  .pcard .who b { font-size: var(--fs-md); }
  .pcard .ring { width: 2.125rem; height: 2.125rem; }
  .pcard .ring::before { width: 1.625rem; height: 1.625rem; font-size: 0.6rem; }
  .pcard .ck { position: absolute; left: 0.3125rem; top: 0.3125rem; opacity: 0; transition: opacity 0.12s; z-index: 2; }
  .pcard:hover .ck, .pcard.sel .ck { opacity: 1; }
  .pcard .ck input { width: 0.9375rem; height: 0.9375rem; accent-color: var(--brand); cursor: pointer; }
  .pcard .mid { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.5rem; margin-top: 0.5rem; }
  .pcard .mid .tag { font-size: 0.64rem; padding: 1px 0.4375rem; }
  .pcard .stars svg { width: 0.75rem; height: 0.75rem; }
  .pcard .foot { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.375rem; color: var(--ink-3); font-size: var(--fs-xs); min-height: 1.5rem; }
  .pcard .foot .when { display: inline-flex; align-items: center; gap: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .foot .when svg.i { width: 0.8125rem; height: 0.8125rem; flex: none; }
  .pcard .foot .iv { color: var(--brand); font-weight: 600; }
  .pcard .foot .ml { color: var(--good); }
  .pcard .qa { margin-left: auto; display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s; flex: none; }
  .pcard:hover .qa, .pcard:focus-within .qa { opacity: 1; }
  .qa button { width: 1.5rem; height: 1.5rem; border: 0; border-radius: 0.4375rem; background: none; color: var(--ink-2); display: grid; place-items: center; }
  .qa button:hover { background: var(--surface-2); color: var(--brand); }
  .qa svg.i { width: 0.9375rem; height: 0.9375rem; }
  .pcard.drag { opacity: 0.35; }
  .pcard .rj { font-size: var(--fs-xs); color: var(--bad); margin-top: 0.375rem; }
  .hiredbadge { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--good); }

  /* ---- bulk bar ---- */
  .bulk { position: sticky; bottom: 1rem; margin: 0.875rem auto 0; width: fit-content; max-width: 100%; background: var(--ink); color: var(--bg); border-radius: 0.75rem; padding: 0.5rem 0.625rem 0.5rem 1rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-lg); z-index: 15; font-size: var(--fs-sm); }
  .bulk .btn { background: transparent; border-color: color-mix(in srgb, var(--bg) 30%, transparent); color: var(--bg); }
  .bulk .btn:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }

  /* ---- list view ---- */
  .lv td .select { height: 1.875rem; width: 9.5rem; font-size: var(--fs-sm); padding: 0 0.5rem; }
  .lv tbody tr { cursor: pointer; }

  /* ---- drawer content ---- */
  .dh { display: flex; align-items: center; gap: 0.875rem; margin-bottom: 1rem; }
  .dh h2 { font-size: var(--fs-xl); }
  .dh .sub { color: var(--ink-2); font-size: var(--fs-sm); }
  .dact { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 1.125rem; }
  .track { display: flex; gap: 3px; margin: 0.25rem 0 1.25rem; }
  .track button { flex: 1 1 0; min-width: 0; border: 0; background: none; padding: 0.4375rem 0 0; position: relative; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track button::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; border-radius: 4px; background: var(--surface-3); }
  .track button.done::before { background: color-mix(in srgb, var(--brand) 45%, var(--surface-3)); }
  .track button.now::before { background: var(--brand); }
  .track button.now { color: var(--brand); }
  .track button:hover { color: var(--ink); }
  .dsec { margin-bottom: 1.25rem; }
  .dsec h4 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; margin-bottom: 0.5rem; }
  .rate { display: inline-flex; gap: 0.125rem; }
  .rate button { border: 0; background: none; color: var(--surface-3); padding: 0; }
  .rate button.on { color: var(--c4); }
  .rate button svg { width: 1.25rem; height: 1.25rem; }
  .note { padding: 0.5625rem 0.75rem; border-radius: 0.625rem; background: var(--surface-2); margin-bottom: 0.375rem; font-size: var(--fs-sm); }
  .note small { display: block; color: var(--ink-3); font-size: var(--fs-xs); margin-bottom: 0.125rem; }
  .mini { display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0.75rem; border: 1px solid var(--line); border-radius: 0.625rem; margin-bottom: 0.375rem; font-size: var(--fs-sm); }
  .mini small { display: block; color: var(--ink-3); font-size: var(--fs-xs); }
  .drop { text-align: center; border: 1.5px dashed var(--line); border-radius: 0.75rem; padding: 1.5rem 1rem; color: var(--ink-2); font-size: var(--fs-sm); background: var(--surface-2); }
  .pickrow { display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .pickrow:last-child { border-bottom: 0; }
  .fpanel { padding: 0.5rem 0.625rem 0.625rem; min-width: 15rem; }
  .fpanel label { display: block; font-size: var(--fs-xs); color: var(--ink-3); margin: 0.5rem 0 0.1875rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .fpanel .select { height: 2rem; }
  @media (max-width: 720px) { .st1 { padding: 0 0.875rem; } .lane { flex-basis: 15.5rem; } .lane-cards { max-height: none; } }

  /* =====================================================================
     VERSION 2 - details on the side, a quiet header, no stage bar, no toolbar row.
     Title and a few actions on top; the role brief on the left; the board on the right.
     ===================================================================== */
  .ptop { display: flex; align-items: flex-start; gap: 0.75rem 1.5rem; flex-wrap: wrap; margin-bottom: 1.125rem; }
  .pt { flex: 1 1 24rem; min-width: 0; }
  .pt-row { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; }
  .ptitle { margin: 0; font-size: var(--fs-2xl); font-weight: 650; letter-spacing: -0.015em; color: var(--ink); }
  .pt .rh-meta { margin-top: 0.125rem; font-size: var(--fs-sm); gap: 0.25rem 1.125rem; }
  .pt .rh-meta svg.i { width: 0.9375rem; height: 0.9375rem; }
  .pacts { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; padding-top: 0.25rem; }
  .pacts .btn.primary { height: 2.25rem; }
  .xbtn.on { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
  .xbtn { position: relative; overflow: visible; }
  .xbtn .xl { overflow: hidden; }
  .fdot { position: absolute; top: -0.3125rem; right: -0.3125rem; min-width: 1rem; height: 1rem; padding: 0 0.25rem; border-radius: 6.1875rem; background: var(--brand); color: var(--brand-ink); font-size: 0.62rem; font-weight: 700; display: grid; place-items: center; }

  .pgrid { display: grid; grid-template-columns: minmax(0, 1fr) 17.5rem; gap: 1.25rem; align-items: start; }
  .pv.min .pgrid { grid-template-columns: minmax(0, 1fr); }
  .pv.min .brief { display: none; }
  .pmain { min-width: 0; }
  .brief { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; padding: 1.125rem 1.125rem 1.25rem; scrollbar-width: thin; margin: 0; }
  .brief .rsec { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .bk-k { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 0.75rem; }
  .bk-k b { display: block; font-size: 1.6rem; font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .bk-k span { font-size: var(--fs-xs); color: var(--ink-3); }
  .bk-vt { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; font-size: var(--fs-sm); color: var(--ink-2); margin-bottom: 0.4375rem; }
  .bk-vt b { font-size: 1.05rem; color: var(--ink); }
  .bk-vt small { color: var(--ink-3); font-size: var(--fs-xs); }
  .bk-dates { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.625rem; font-size: var(--fs-xs); }
  .brief .closed-note { margin-top: 1rem; }
  .brief .pplist { flex-direction: column; align-items: flex-start; gap: 0.3125rem; }

  /* lanes: no grey tray, each lane starts with a small header tile */
  .board { gap: 0.875rem; padding: 0 0 1rem; min-height: 24rem; }
  .lane { flex: 1 0 13.5rem; background: transparent; padding: 0.25rem; border-radius: 0.875rem; min-height: 12rem; }
  .lane.over { background: color-mix(in srgb, var(--brand) 6%, transparent); outline-color: var(--brand); }
  .lane.rej { background: transparent; }
  .lane-head { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--sc, var(--ink-3)); border-radius: 0.625rem; padding: 0.5rem 0.4375rem 0.5rem 0.625rem; margin-bottom: 0.5rem; }
  .lane-head .dot { display: none; }
  .lane-head .n { background: var(--surface-2); font-weight: 600; }
  .lane.mini { flex: 0 0 3rem; }
  .lane.mini .lane-head { padding: 0.625rem 0; }
  .lane-cards { max-height: calc(100vh - 11rem); }
  .pmin .lane-cards { max-height: calc(100vh - 11rem); }

  /* cards: flatter, AI match as a small pill, a hairline above the footer */

    var j = job(), d = openDrawer({ title: "Edit recruitment", body: '<div class="form-grid"><div class="full"><label class="lbl">Title <span class="req">*</span></label><input class="input" id="eTitle" value="' + esc(j.title) + '"></div><div><label class="lbl">Department</label><select class="select" id="eDept">' + opts(["Development", "Designing", "Human Resource", "Accounts", "Business Development"], j.dept) + '</select></div><div><label class="lbl">Vacancies</label><input class="input" id="eVac" type="number" min="' + Math.max(1, j.filled) + '" value="' + j.openings + '"></div><div><label class="lbl">Location</label><input class="input" id="eLoc" value="' + esc(j.loc) + '"></div><div><label class="lbl">End date</label><input class="input" id="eEnd" type="date" value="' + j.end + '"></div><div class="full"><label class="lbl">Recruitment managers</label><select class="select" id="eMgr" multiple style="height:6rem">' + opts(DEMO.team, "") + '</select></div><label class="row full"><span class="switch"><input type="checkbox" id="eLi"' + (j.linkedin ? " checked" : "") + '><span></span></span>Also post on LinkedIn</label></div>', foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" id="eSave">Save changes</button>' });
    [].forEach.call($("#eMgr", d).options, function (o) { o.selected = j.managers.indexOf(o.value) >= 0; });
    $("#eSave", d).addEventListener("click", function () {
      var t = $("#eTitle", d).value.trim(); if (!t) { toast("Please enter a title"); return; }
      var mg = [].map.call($("#eMgr", d).selectedOptions, function (o) { return o.value; });
      j.title = t; j.dept = $("#eDept", d).value; j.openings = Math.max(+$("#eVac", d).value || 1, j.filled); j.loc = $("#eLoc", d).value; j.end = $("#eEnd", d).value || j.end; j.linkedin = $("#eLi", d).checked; if (mg.length) { j.managers = mg; }
      d.close(); toast("Recruitment updated"); redraw();
    });
  }

  /* ---------- candidate drawer ---------- */
  var curDrawer = null;
  function fillDrawer() {
    var d = curDrawer; if (!d) { return; }
    var c = DEMO.cand(d.id), st = typeOf(c), idx = laneStages().map(function (s) { return s.key; }).indexOf(keyOf(c));
    var ivs = DEMO.interviews.filter(function (i) { return i.cand === c.id; }), notes = NOTES[c.id] || [];
    var track = laneStages().map(function (s, n) { return '<button data-go="' + s.key + '" class="' + (s.key === keyOf(c) && st !== "cancelled" ? "now" : n < idx && st !== "cancelled" ? "done" : "") + '" title="' + esc(s.name) + '">' + esc(s.name) + "</button>"; }).join("");
    d.querySelector(".drawer-body").innerHTML =
      '<div class="dh">' + avatar(c.name, "lg") + "<div><h2>" + esc(c.name) + '</h2><div class="sub">' + esc(job().title) + '</div><div class="row" style="margin-top:0.375rem">' + (st === "cancelled" ? chip("Rejected", "bad", true) : chip(stageByKey(keyOf(c)).name, st === "hired" ? "good" : "info", true)) + ring(c.ai) + "</div></div></div>" +
      '<div class="dact"><button class="btn sm" data-d="sched">' + icon("calendar", "sm") + 'Schedule interview</button><button class="btn sm" data-d="mail">' + icon("mail", "sm") + 'Send mail</button><button class="btn sm" data-d="offer">' + icon("send", "sm") + 'Send LOI</button><button class="btn sm" data-d="docs">' + icon("file", "sm") + 'Request documents</button><button class="btn sm" data-d="resume">' + icon("eye", "sm") + "Resume</button></div>" +
      (st === "cancelled" ? '<div class="callout" style="margin-bottom:1rem">' + icon("x", "sm") + "<div><b>Rejected:</b> " + esc(c.reason || "Not a good fit") + '</div><button class="btn sm right" data-go="' + laneStages()[0].key + '">Reopen</button></div>' : '<div class="track">' + track + "</div>") +
      '<div class="dsec"><h4>Rating</h4><div class="rate">' + [1, 2, 3, 4, 5].map(function (n) { return '<button data-rate="' + n + '" class="' + (c.rating >= n ? "on" : "") + '" aria-label="' + n + ' stars">' + icon("starFill") + "</button>"; }).join("") + "</div></div>" +
      (c.mail ? '<div class="dsec"><h4>Last mail</h4><div class="mini">' + icon("mail", "sm") + "<div>" + esc(c.mail) + "</div></div></div>" : "") +
      (ivs.length ? '<div class="dsec"><h4>Interviews</h4>' + ivs.map(function (i) { return '<div class="mini">' + icon(i.mode === "Video call" ? "video" : "user", "sm") + "<div><b>" + esc(i.round) + "</b><small>" + fmtDate(i.date) + " · " + i.time + " · " + i.status + "</small></div></div>"; }).join("") + "</div>" : "") +
      '<div class="dsec"><h4>Details</h4><dl class="dl" style="grid-template-columns:6.5rem 1fr"><dt>Email</dt><dd>' + esc(c.email) + "</dd><dt>Phone</dt><dd>" + esc(c.phone) + "</dd><dt>Location</dt><dd>" + esc(c.loc) + "</dd><dt>Experience</dt><dd>" + c.exp + " yrs · notice " + esc(c.notice) + "</dd><dt>Expected CTC</dt><dd>" + esc(c.ctc) + "</dd><dt>Source</dt><dd>" + esc(c.source) + " · " + ago(c.applied) + '</dd></dl><div class="tags" style="margin-top:0.625rem">' + c.skills.map(function (s) { return '<span class="tag">' + esc(s) + "</span>"; }).join("") + "</div></div>" +
      '<div class="dsec"><h4>Notes</h4><div class="row" style="margin-bottom:0.5rem"><input class="input" id="dNote" placeholder="Add a note and press Enter"><button class="btn" data-d="note">Add</button></div>' + (notes.map(function (n) { return '<div class="note"><small>' + esc(n.by) + " · " + shortDate(n.at) + "</small>" + esc(n.text) + "</div>"; }).join("") || '<div class="faint" style="font-size:var(--fs-sm)">No notes yet.</div>') + "</div>" +
      '<div class="dsec"><h4>History</h4><div class="timeline">' + c.hist.slice().reverse().map(function (h) { return '<div class="tl"><b>' + esc(h.t) + "</b><small>" + fmtDate(h.at) + "</small></div>"; }).join("") + "</div></div>";
    d.querySelector(".drawer-foot").innerHTML = '<button class="btn danger" data-d="reject" style="margin-right:auto"' + (st === "cancelled" ? " hidden" : "") + ">" + icon("x", "sm") + 'Reject</button><button class="btn" data-d="zone">' + icon("spark", "sm") + 'Skill zone</button>' + (st === "hired" ? '<button class="btn primary" data-d="employee">' + icon("userplus", "sm") + "Convert to employee</button>" : '<a class="btn primary" href="candidate-profile.html?id=' + c.id + '">Open</a>');
  }
  function openCand(id) {
    var d = openDrawer({ title: "Candidate", body: "", foot: "x" }); curDrawer = { id: id, el: d };
    d.querySelector(".drawer").style.width = "min(34rem, 100%)";
    curDrawer.querySelector = function (s) { return d.querySelector(s); };
    var close = d.close; d.close = function () { curDrawer = null; close(); };
    fillDrawer();
    d.addEventListener("click", function (e) {
      var c = DEMO.cand(id);
      var g = e.target.closest("[data-go]"); if (g) { requestMove([id], g.dataset.go); return; }
      var r = e.target.closest("[data-rate]"); if (r) { c.rating = c.rating === +r.dataset.rate ? 0 : +r.dataset.rate; redraw(); fillDrawer(); return; }
      var a = e.target.closest("[data-d]"); if (!a) { return; }
      var act = a.dataset.d;
      if (act === "sched") { scheduleModal(id); }
      else if (act === "mail") { mailModal([id], "invite"); } else if (act === "offer") { mailModal([id], "offer"); } else if (act === "docs") { mailModal([id], "docs"); }
      else if (act === "resume") { toast("Opening " + c.name + "'s resume (demo)"); }
      else if (act === "note") { var t = $("#dNote", d); if (t.value.trim()) { (NOTES[id] = NOTES[id] || []).unshift({ by: DEMO.me.name, at: DEMO.today, text: t.value.trim() }); fillDrawer(); toast("Note added"); } }
      else if (act === "reject") { rejectModal([id]); }
      else if (act === "zone") { toast(c.name + " added to the skill zone"); }
      else if (act === "employee") { toast(c.name + " converted to an employee (demo)"); }
    });
    d.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.id === "dNote") { e.preventDefault(); d.querySelector('[data-d="note"]').click(); } });
  }

  /* ---------- clicks ---------- */
  function cardMenu(anchor, id) {
    var c = DEMO.cand(id), items = '<button class="item" data-pick="open">' + icon("user", "sm") + 'Open full profile</button><button class="item" data-pick="sched">' + icon("calendar", "sm") + 'Schedule interview</button><button class="item" data-pick="docs">' + icon("file", "sm") + 'Request documents</button><button class="item" data-pick="zone">' + icon("spark", "sm") + 'Add to skill zone</button><button class="item" data-pick="archive">' + icon("inbox", "sm") + 'Archive</button><div class="sep"></div>' + (typeOf(c) === "cancelled" ? '<button class="item" data-pick="reopen">' + icon("refresh", "sm") + "Reopen</button>" : '<button class="item danger" data-pick="reject">' + icon("x", "sm") + "Reject</button>");
    openMenu(anchor, items, function (v) {
      if (v === "open") { go("candidate-profile.html?id=" + id); } else if (v === "sched") { scheduleModal(id); } else if (v === "docs") { mailModal([id], "docs"); }
      else if (v === "zone") { toast(c.name + " added to the skill zone"); } else if (v === "archive") { C.splice(C.indexOf(c), 1); toast(c.name + " archived"); redraw(); } else if (v === "reject") { requestMove([id], rejStage().key); } else if (v === "reopen") { requestMove([id], laneStages()[0].key); }
    }, 200);
  }
  $("#out").addEventListener("click", function (e) {
    var q = e.target.closest("[data-q]");
    if (q) {
      e.stopPropagation(); var host = e.target.closest("[data-id]"), id = +host.dataset.id;
      var act = q.dataset.q;
      if (act === "sched") { if (!guardClosed()) { scheduleModal(id); } }
      else if (act === "loi") { mailModal([id], "offer"); }
      else if (act === "docs") { mailModal([id], "docs"); }
      else if (act === "mail") { mailModal([id], "invite"); }
      else if (act === "note") { noteModal(id); }
      else if (act === "status") {
        openMenu(q, "<h4>Move to</h4>" + laneStages().map(function (s) { return '<button class="item' + (s.key === keyOf(DEMO.cand(id)) ? " on" : "") + '" data-pick="' + s.key + '"><span class="dot" style="width:0.5rem;height:0.5rem;border-radius:2px;background:' + color(s) + '"></span>' + esc(s.name) + "</button>"; }).join("") + '<div class="sep"></div><button class="item danger" data-pick="__rej">' + icon("x", "sm") + "Reject</button>", function (k) { requestMove([id], k === "__rej" ? rejStage().key : k); }, 190);
      } else { cardMenu(q, id); }
      return;
    }
    if (e.target.closest("[data-sel]")) { return; }
    var sm = e.target.closest("[data-smenu]");
    if (sm) { e.stopPropagation(); stageMenu(sm, sm.dataset.smenu); return; }
    var ai = e.target.closest("[data-addin]"); if (ai) { candModal(ai.dataset.addin); return; }
    var mo = e.target.closest("[data-more]"); if (mo) { S.more[mo.dataset.more] = (S.more[mo.dataset.more] || 6) + 6; drawOut(); return; }
    var em = e.target.closest("[data-empty]"); if (em) { em.dataset.empty === "add" ? candModal() : uploadModal(); return; }
    var th = e.target.closest("[data-togrej]"); if (th) { S.rej = !S.rej; drawTools(); drawOut(); return; }
    if (e.target.closest("select, .lane-head")) { return; }
    var host2 = e.target.closest("[data-id]"); if (host2) { go("candidate-profile.html?id=" + host2.dataset.id); }   // a card or row opens the complete profile page
  });
  $("#out").addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.classList.contains("pcard")) { go("candidate-profile.html?id=" + e.target.dataset.id); } });
  $("#out").addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "allSel") { jobCands().filter(visible).forEach(function (c) { if (t.checked) { S.sel[c.id] = 1; } else { delete S.sel[c.id]; } }); drawOut(); drawBulk(); return; }
    if (t.dataset.sel) { if (t.checked) { S.sel[t.dataset.sel] = 1; } else { delete S.sel[t.dataset.sel]; } var card = t.closest(".pcard"); if (card) { card.classList.toggle("sel", t.checked); } drawBulk(); return; }
    if (t.dataset.stsel) { requestMove([+t.dataset.stsel], t.value); }
  });
  function stageMenu(anchor, key) {
    var arr = stages(), i = arr.map(function (s) { return s.key; }).indexOf(key);
    openMenu(anchor, '<button class="item" data-pick="edit">' + icon("edit", "sm") + 'Edit stage</button><button class="item" data-pick="add">' + icon("plus", "sm") + 'Add candidate here</button><button class="item" data-pick="left"' + (i === 0 ? " disabled" : "") + '>' + icon("left", "sm") + 'Move left</button><button class="item" data-pick="right"' + (i >= arr.length - 1 ? " disabled" : "") + '>' + icon("right", "sm") + 'Move right</button><div class="sep"></div><button class="item danger" data-pick="del">' + icon("trash", "sm") + "Delete stage</button>", function (v) {
      var st = stageByKey(key);
      if (v === "edit") { stageModal(key); } else if (v === "add") { candModal(key); }
      else if (v === "left" || v === "right") { var j = v === "left" ? i - 1 : i + 1; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; toast("Sequence updated"); redraw(); }
      else if (v === "del") {
        var n = jobCands().filter(function (c) { return keyOf(c) === key; }).length;
        if (laneStages().length <= 2) { toast("A pipeline needs at least two stages"); return; }
        confirmModal("Delete stage?", "<b>" + esc(st.name) + "</b> will be removed." + (n ? " Its " + n + " candidate" + (n === 1 ? "" : "s") + " move to the first stage." : ""), "Delete stage", true, function () {
          var first = laneStages().filter(function (s) { return s.key !== key; })[0].key; C.forEach(function (c) { if (c.job === jobId && c.stage === key) { c.stage = first; c.hist.push({ t: "Moved to " + stageByKey(first).name + " (stage deleted)", at: DEMO.today }); } });
          arr.splice(arr.indexOf(st), 1); toast("Stage deleted"); redraw();
        });
      }
    }, 190);
  }
  function headClick(e) {
    if (e.target.closest("#prevJob")) { flip(-1); return; }
    if (e.target.closest("#nextJob")) { flip(1); return; }
    var jm = e.target.closest("#jobMore"); if (jm) { e.stopPropagation(); jobMenu(jm); return; }
    if (e.target.closest("#minBtn")) {
      S.min = !S.min; try { localStorage.setItem("ariel-pipe2-min", S.min ? "1" : "0"); } catch (x) {}
      $("#pv").classList.toggle("min", S.min); document.body.classList.toggle("pmin", S.min); drawTools(); fitBoard(); return;
    }
    if (e.target.closest("#jdMore")) { var jd = $("#jd"); jd.classList.toggle("open"); $("#jdw").classList.toggle("open", jd.classList.contains("open")); e.target.closest("#jdMore").textContent = jd.classList.contains("open") ? "Show less" : "Read more"; fitBoard(); return; }
    if (e.target.closest("#liPost")) { job().linkedin = true; toast("Posted to LinkedIn (demo)"); drawHead(); return; }
    var jb = e.target.closest("#jobBtn");
    if (jb) {
      e.stopPropagation();
      var open = DEMO.jobs.filter(function (j) { return j.status === "open"; }), closed = DEMO.jobs.filter(function (j) { return j.status === "closed"; });
      var row = function (j) { return '<button class="item' + (j.id === jobId ? " on" : "") + '" data-pick="' + j.id + '">' + esc(j.title) + (j.linkedin ? " " + liIcon() : "") + '<span class="tail">' + C.filter(function (c) { return c.job === j.id; }).length + "</span></button>"; };
      openMenu(jb, "<h4>Open recruitments</h4>" + open.map(row).join("") + (closed.length ? "<h4>Closed</h4>" + closed.map(row).join("") : ""), function (v) { jobId = +v; S.sel = {}; S.more = {}; setUrl(); redraw(); }, 280);
    }
  }
  ["ptop", "rhead"].forEach(function (id) { document.getElementById(id).addEventListener("click", headClick); });
  /* [ and ] flip between pipelines when you are not typing */
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea, select")) { return; }
    if (e.key === "[") { flip(-1); } else if (e.key === "]") { flip(1); }
  });
  function openFilters(fb) {
    var srcs = ["all"].concat(C.filter(function (c) { return c.job === jobId; }).map(function (c) { return c.source; }).filter(function (s, i, a) { return a.indexOf(s) === i; }));
    var m = openMenu(fb, '<div class="fpanel"><label>Minimum rating</label><select class="select" data-k="rate">' + opts([["0", "Any"], ["1", "1 star +"], ["2", "2 stars +"], ["3", "3 stars +"], ["4", "4 stars +"], ["5", "5 stars"]], String(S.rate)) + '</select><label>Minimum AI match</label><select class="select" data-k="ai">' + opts([["0", "Any"], ["60", "60 +"], ["70", "70 +"], ["80", "80 +"], ["90", "90 +"]], String(S.ai)) + '</select><label>Source</label><select class="select" data-k="src">' + srcs.map(function (s) { return '<option value="' + esc(s) + '"' + (s === S.src ? " selected" : "") + ">" + (s === "all" ? "All sources" : esc(s)) + "</option>"; }).join("") + '</select><button class="btn sm" style="width:100%;margin-top:0.75rem" data-reset>Reset filters</button></div>', null, 250);
    if (!m) { return; }
    m.addEventListener("change", function (ev) { var k = ev.target.dataset.k; if (k) { S[k] = k === "src" ? ev.target.value : +ev.target.value; drawTools(); drawOut(); } });
    m.querySelector("[data-reset]").addEventListener("click", function () { S.rate = 0; S.ai = 0; S.src = "all"; closeMenu(); drawTools(); drawOut(); });
  }
  function toggleJobFlow() {
    var j = job();
    if (isClosed()) { confirmModal("Reopen this recruitment?", "<b>" + esc(j.title) + "</b> will accept candidates again.", "Reopen", false, function () { j.status = "open"; toast("Recruitment reopened"); redraw(); }); }
    else { confirmModal("Close this recruitment?", "<b>" + esc(j.title) + "</b> stops taking candidates. You can reopen it later.", "Close recruitment", true, function () { j.status = "closed"; toast("Recruitment closed"); redraw(); }); }
  }
  function deleteJob() {
    var j = job(), n = jobCands().length;
    confirmModal("Delete this recruitment?", "<b>" + esc(j.title) + "</b> and its " + n + " candidate" + (n === 1 ? "" : "s") + " will be removed. This cannot be undone.", "Delete", true, function () {
      for (var k = C.length - 1; k >= 0; k--) { if (C[k].job === j.id) { C.splice(k, 1); } }
      var at = DEMO.jobs.indexOf(j); DEMO.jobs.splice(at, 1);
      if (!DEMO.jobs.length) { go("job-openings.html"); return; }
      jobId = DEMO.jobs[Math.min(at, DEMO.jobs.length - 1)].id; S.sel = {}; S.more = {}; setUrl(); toast("Recruitment deleted"); redraw();
    });
  }
  /* the three dots in the corner of the details card */
  function jobMenu(anchor) {
    openMenu(anchor,
      '<button class="item" data-pick="stage">' + icon("layers", "sm") + 'Add stage</button><button class="item" data-pick="edit">' + icon("edit", "sm") + 'Edit</button><button class="item" data-pick="toggle">' + icon(isClosed() ? "refresh" : "flag", "sm") + (isClosed() ? "Reopen" : "Close") + '</button><div class="sep"></div><button class="item danger" data-pick="del">' + icon("trash", "sm") + "Delete</button>",
      function (v) {
        if (v === "stage") { stageModal(); } else if (v === "edit") { editJobDrawer(); } else if (v === "toggle") { toggleJobFlow(); } else if (v === "del") { deleteJob(); }
      }, 180);
  }
  $("#tools").addEventListener("click", function (e) {
    if (e.target.closest("#addBtn")) { candModal(); return; }
    var xs = e.target.closest("#xs"); if (xs) { $("#q").focus(); return; }
  });
  $("#tools").addEventListener("input", function (e) { if (e.target.id === "q") { S.q = e.target.value.toLowerCase(); $("#xs").classList.toggle("has", !!e.target.value); drawOut(); } });

  /* bulk actions */
  $("#bulk").addEventListener("click", function (e) {
    var b = e.target.closest("[data-b]"); if (!b) { return; } var ids = Object.keys(S.sel).map(Number);
    if (b.dataset.b === "clear") { S.sel = {}; drawOut(); drawBulk(); }
    else if (b.dataset.b === "mail") { mailModal(ids, "invite"); }
    else if (b.dataset.b === "reject") { requestMove(ids, rejStage().key); }
    else if (b.dataset.b === "zone") { toast(ids.length + " added to the skill zone"); S.sel = {}; drawOut(); drawBulk(); }
    else if (b.dataset.b === "move") { e.stopPropagation(); openMenu(b, laneStages().map(function (s) { return '<button class="item" data-pick="' + s.key + '"><span class="dot" style="width:0.5rem;height:0.5rem;border-radius:2px;background:' + color(s) + '"></span>' + esc(s.name) + "</button>"; }).join(""), function (k) { requestMove(ids, k); }, 190); }
  });

  /* ---------- drag and drop: cards between lanes, lanes by their header ---------- */
  var dragCard = null, dragStage = null;
  document.addEventListener("dragstart", function (e) {
    var h = e.target.closest && e.target.closest("[data-head]");
    if (h) { dragStage = h.dataset.head; h.closest(".lane").classList.add("lane-drag"); e.dataTransfer.setData("text/plain", "stage"); e.dataTransfer.effectAllowed = "move"; return; }
    var k = e.target.closest && e.target.closest(".pcard"); if (!k) { return; }
    if (isClosed()) { e.preventDefault(); toast("This recruitment is closed. Reopen it first."); return; }
    dragCard = +k.dataset.id; k.classList.add("drag"); e.dataTransfer.setData("text/plain", String(dragCard)); e.dataTransfer.effectAllowed = "move";
  });
  document.addEventListener("dragend", function () { dragCard = null; dragStage = null; if ($("#board")) { drawOut(); } });
  document.addEventListener("dragover", function (e) {
    var l = e.target.closest && e.target.closest(".lane"); if (!l || !(dragCard || dragStage)) { return; }
    if (dragStage && l.classList.contains("rej")) { return; }
    e.preventDefault(); [].forEach.call(document.querySelectorAll(".lane"), function (x) { x.classList.toggle(dragStage ? "stage-over" : "over", x === l); });
  });
  document.addEventListener("drop", function (e) {
    var l = e.target.closest && e.target.closest(".lane"); if (!l) { return; }
    if (dragStage) {
      e.preventDefault(); var from = dragStage, to = l.dataset.stage; dragStage = null;
      if (from !== to && !l.classList.contains("rej")) { var arr = stages(), a = arr.map(function (s) { return s.key; }); var item = arr.splice(a.indexOf(from), 1)[0]; arr.splice(arr.map(function (s) { return s.key; }).indexOf(to) + (a.indexOf(from) < a.indexOf(to) ? 1 : 0), 0, item); toast("Sequence updated"); }
      redraw(); return;
    }
    if (!dragCard) { return; }
    e.preventDefault(); var ids = S.sel[dragCard] ? Object.keys(S.sel).map(Number) : [dragCard]; dragCard = null;
    requestMove(ids, l.classList.contains("rej") ? rejStage().key : l.dataset.stage);
  });

  redraw();
})();
</script>
<script src="js/shell.js"></script>
<script>fitX();</script>
