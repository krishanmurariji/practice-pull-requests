<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .doc { background: #fff; color: #222; border: 1px solid var(--line); border-radius: 0.5rem; padding: 2.125rem 2.5rem; max-width: 47.5rem; box-shadow: var(--shadow-sm); font-size: 0.86rem; }
  .doc h2 { font-size: 1.4rem; color: #111; margin-bottom: 2px; }
  .doc h4 { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.7rem; color: #666; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; margin: 1.25rem 0 0.5rem; }
  .doc p, .doc li { color: #333; margin-bottom: 0.25rem; }
  .doc ul { list-style: disc; padding-left: 1.125rem; }
  .reason li { display: flex; gap: 0.625rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .reason li:last-child { border: 0; }
  .reason .ico { width: 1.5rem; height: 1.5rem; border-radius: 0.4375rem; display: grid; place-items: center; flex: none; }
  .reason .ok { background: var(--good-soft); color: var(--good); }
  .reason .gap { background: var(--warn-soft); color: var(--warn); }
  .qa dt { font-weight: 600; margin-top: 0.875rem; }
  .qa dd { margin: 0.25rem 0 0; color: var(--ink-2); }

  /* ---- header in the same style as the candidates grid ---- */
  .crumb { display: flex; align-items: center; gap: 0.625rem; margin-bottom: 1rem; font-size: var(--fs-md); color: var(--ink-3); }
  .crumb .back { width: 2.25rem; height: 2.25rem; border: 1px solid var(--line); border-radius: 0.625rem; display: grid; place-items: center; background: var(--surface); color: var(--ink); }
  .crumb .back:hover { background: var(--surface-2); text-decoration: none; }
  .crumb a { color: var(--ink-3); } .crumb b { color: var(--ink); font-weight: 600; }
  .phd { padding: 1.25rem 1.5rem 1.375rem; border-radius: 1rem; }
  .phd .top { display: flex; gap: 1.125rem; align-items: center; flex-wrap: wrap; }
  .phd h1 { font-size: 1.9rem; letter-spacing: -0.03em; font-weight: 650; line-height: 1.1; }
  .phd .sub { display: flex; gap: 0.5rem 1.375rem; flex-wrap: wrap; color: var(--ink-2); font-size: var(--fs-md); margin-top: 0.5rem; }
  .phd .sub span { display: inline-flex; gap: 0.4375rem; align-items: center; }
  .phd .sub svg.i { color: var(--ink-3); width: 1rem; height: 1rem; }
  .phd .acts { margin-left: auto; display: flex; gap: 0.5rem; align-self: flex-start; flex-wrap: wrap; }
  .pf { display: flex; gap: 0.75rem 2.75rem; flex-wrap: wrap; margin-top: 1.25rem; }
  .pf small { display: block; color: var(--ink-3); font-size: var(--fs-xs); }
  .pf b { font-weight: 500; font-size: var(--fs-md); }
  .trk { display: flex; align-items: stretch; gap: 1.25rem; margin-top: 1.125rem; border: 1px solid var(--line); border-radius: 1rem; padding: 1.125rem 1.25rem; }
  .trk .steps { flex: 1 1 auto; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .trk .step { position: relative; text-align: center; }
  .trk .step::before { content: ""; position: absolute; top: 1.0625rem; left: -50%; right: 50%; height: 2px; background: var(--line); }
  .trk .step:first-child::before { display: none; }
  .trk .step.done::before, .trk .step.now::before { background: var(--brand); }
  .trk .dot { position: relative; z-index: 1; width: 2.25rem; height: 2.25rem; border-radius: 50%; margin: 0 auto 0.5rem; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); border: 2px solid transparent; }
  .trk .dot svg.i { width: 1.0625rem; height: 1.0625rem; }
  .trk .done .dot { background: var(--brand); color: var(--brand-ink); }
  .trk .now .dot { background: var(--surface); border-color: var(--brand); color: var(--brand); }
  .trk .step b { display: block; font-weight: 500; font-size: var(--fs-md); color: var(--ink-2); }
  .trk .done b { color: var(--ink); }
  .trk .now b { color: var(--brand); }
  .trk .step small { color: var(--ink-3); font-size: var(--fs-xs); }
  .trk.off .dot { background: var(--surface-2); color: var(--ink-3); border-color: transparent; }
  .trk.off .step::before { background: var(--line) !important; }
  .dtile { flex: none; width: 9.5rem; border-radius: 0.875rem; background: color-mix(in srgb, var(--brand) 9%, var(--surface)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0.5rem; }
  .dtile b { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; }
  .dtile small { color: var(--ink-3); font-size: var(--fs-xs); }
  @media (max-width: 880px) { .trk { flex-direction: column; } .dtile { width: auto; flex-direction: row; gap: 0.5rem; justify-content: center; } }
  /* the About tab: summary on the left, skill matching on the right */
  .abt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
  @media (max-width: 1000px) { .abt { grid-template-columns: minmax(0, 1fr); } }
  .abt .card { border-radius: 1rem; }
  .abt h3 { font-size: var(--fs-lg); font-weight: 650; }
  .mhead { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.875rem; }
  .mhead .sp { width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; box-shadow: 0 0.25rem 0.75rem color-mix(in srgb, var(--brand) 30%, transparent); }
  .mscore { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 0.875rem; }
  .mscore b { font-size: 1.9rem; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
  .mscore small { display: block; color: var(--ink-3); font-size: var(--fs-xs); margin-top: 0.3125rem; }
  .mword { padding: 0.3125rem 0.875rem; border-radius: 6.1875rem; font-size: var(--fs-sm); font-weight: 600; }
  .reqs { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.625rem 1rem; margin-bottom: 1rem; }
  .reqs span { display: flex; align-items: center; gap: 0.4375rem; font-size: var(--fs-sm); }
  .reqs .ok { color: var(--ink); } .reqs .ok svg.i { color: var(--good); }
  .reqs .no { color: var(--ink-3); } .reqs .no svg.i { color: var(--ink-3); opacity: 0.5; }
  .reqs svg.i { width: 0.9375rem; height: 0.9375rem; flex: none; }
  .aibox2 { padding: 0.875rem 1rem; border-radius: 0.875rem; background: color-mix(in srgb, var(--brand) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 16%, var(--surface)); }
  .aibox2 b { display: flex; align-items: center; gap: 0.4375rem; color: var(--brand); font-size: var(--fs-md); margin-bottom: 0.3125rem; }
  .aibox2 p { font-size: var(--fs-sm); line-height: 1.6; color: var(--ink); }
  .chips2 { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chips2 span { padding: 0.3125rem 0.875rem; border-radius: 6.1875rem; background: var(--surface-2); font-size: var(--fs-sm); font-weight: 500; }

  /* ---- round 2: header like Job Openings, stepper card, About tab with four cards ---- */
  .phh { align-items: center; }
  .phid { display: flex; align-items: center; gap: 0.875rem; min-width: 0; }
  .phid .av { --s: 3.25rem; flex: none; }
  .nrow { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; }
  .nrow h1 { font-size: var(--fs-xl); line-height: 1.2; }
  .srcbadge { display: inline-flex; align-items: center; gap: 0.4375rem; height: 1.625rem; padding: 0 0.6875rem 0 0.25rem; border-radius: 6.1875rem; background: var(--surface-2); font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .slogo { flex: none; width: 1.375rem; height: 1.375rem; border-radius: 0.375rem; background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
  .slogo svg.i { width: 0.8125rem; height: 0.8125rem; }
  .slogo .li { width: 0.9375rem; height: 0.9375rem; display: block; }
  .dl dd .slogo { display: inline-grid; vertical-align: middle; margin-right: 0.4375rem; }
  .slogo b { font-size: 0.66rem; font-weight: 800; color: #fff; width: 100%; height: 100%; border-radius: inherit; display: grid; place-items: center; }
  .slogo .nk { background: #275df5; } .slogo .bh { background: #1769ff; font-size: 0.58rem; }
  .pcard2 { padding: 1.25rem 1.5rem 1.125rem; border-radius: 1rem; }
  .pcard2 .trk { border: 0; padding: 0; margin: 0; }
  .pc-row { display: grid; grid-template-columns: repeat(4, max-content) minmax(0, 1fr); gap: 1rem 2.5rem; align-items: center; margin-top: 1.25rem; padding-top: 1.125rem; border-top: 1px solid var(--line); }
  .pcf small { display: block; color: var(--ink-3); font-size: var(--fs-xs); margin-bottom: 0.25rem; }
  .pcf b { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: var(--fs-md); }
  .pcf b.big { font-size: 1.4rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
  .neg { display: inline-flex; align-items: center; gap: 0.4375rem; height: 1.75rem; padding: 0 0.8125rem 0 0.625rem; border-radius: 6.1875rem; border: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 650; font-size: var(--fs-sm); cursor: pointer; }
  .neg::before { content: ""; width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--ink-3); }
  .neg.on { background: var(--good-soft); color: var(--good); }
  .neg.on::before { background: var(--good); }
  .aisum { display: flex; align-items: center; gap: 0.875rem; min-width: 0; padding: 0.75rem 1rem; border-radius: 0.875rem; background: color-mix(in srgb, var(--brand) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 15%, var(--surface)); }
  .mring { --p: 80; --c: var(--brand); width: 3rem; height: 3rem; border-radius: 50%; flex: none; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-3) 0); display: grid; place-items: center; }
  .mring::before { content: attr(data-v) "%"; width: 2.3125rem; height: 2.3125rem; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; font-variant-numeric: tabular-nums; }
  .aisum b { display: flex; align-items: center; gap: 0.4375rem; font-size: var(--fs-sm); color: var(--brand); margin-bottom: 0.1875rem; }
  .aisum b span { color: var(--ink-3); font-weight: 500; }
  .aisum p { font-size: var(--fs-sm); line-height: 1.55; color: var(--ink); }
  @media (max-width: 1180px) { .pc-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .aisum { grid-column: 1 / -1; } }
  .abt2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
  @media (max-width: 1000px) { .abt2 { grid-template-columns: minmax(0, 1fr); } }
  .abt2 .card { border-radius: 1rem; }
  .abt2 h3 { font-size: var(--fs-lg); font-weight: 650; }
  .hist { display: flex; flex-direction: column; gap: 0.875rem; }
  .hist .it { display: flex; gap: 0.75rem; }
  .hist .ic { width: 2.25rem; height: 2.25rem; border-radius: 0.625rem; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
  .hist b { display: block; font-weight: 600; }
  .hist small { display: block; color: var(--ink-3); font-size: var(--fs-sm); }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
  .kpis > div { border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.75rem 0.875rem; }
  .kpis small { display: block; color: var(--ink-3); font-size: var(--fs-xs); }
  .kpis b { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.01em; }
  .kpis .up { color: var(--good); }
  .chips3 { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chips3 span { padding: 0.375rem 0.9375rem; border-radius: 6.1875rem; background: var(--brand-soft); color: var(--brand); font-size: var(--fs-sm); font-weight: 600; }

  /* ---- full application form blocks ---- */
  .eb { border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.875rem 1rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.75rem 1.25rem; }
  .eb + .eb { margin-top: 0.625rem; }
  .eb small { display: block; color: var(--ink-3); font-size: var(--fs-xs); margin-bottom: 0.125rem; }
  .eb b { font-weight: 600; font-size: var(--fs-md); overflow-wrap: anywhere; }
  .eb .full { grid-column: 1 / -1; }
  .why { color: var(--ink-2); line-height: 1.65; font-size: var(--fs-md); }
  .tag-ok { display: inline-flex; align-items: center; height: 1.375rem; padding: 0 0.625rem; border-radius: 6.1875rem; font-size: var(--fs-xs); font-weight: 650; background: var(--surface-2); color: var(--ink-2); }
  .tag-ok.good { background: var(--good-soft); color: var(--good); }
  .tag-ok.info { background: var(--brand-soft); color: var(--brand); }

  /* ---- round 3: contact line under the name, AI summary over a three-part row, three-column details ---- */
  .hsub { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
  .hsub span { display: inline-flex; align-items: center; gap: 0.4375rem; }
  .page-head .hsub { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 0.1875rem; }
  .hsub span { font-weight: 500; }
  .hsub svg.i { width: 0.9375rem; height: 0.9375rem; color: var(--ink-2); }
  .pcard2 .aisum { margin: 0; }
  .pc-row3 { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 1.5rem 2.25rem; align-items: center; margin-top: 1.375rem; }
  .pc-row3 .pcf.r { text-align: right; }
  .pc-row3 .pcf.r b { justify-content: flex-end; }
  @media (max-width: 900px) { .pc-row3 { grid-template-columns: 1fr 1fr; } .pc-row3 .trk { grid-column: 1 / -1; order: 3; } }
  .abt3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; align-items: start; }
  .abt3 + .abt3 { margin-top: 1rem; }
  @media (max-width: 1180px) { .abt3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 720px) { .abt3 { grid-template-columns: minmax(0, 1fr); } }
  .abt3 .card { border-radius: 1rem; }
  .abt3 h3 { font-size: var(--fs-lg); font-weight: 650; }
  .abt3 .dl { grid-template-columns: 7.25rem minmax(0, 1fr); }
  .gd { display: inline-flex; align-items: center; gap: 0.4375rem; }
  .gd svg { width: 1.0625rem; height: 1.0625rem; flex: none; }
  .gd.male svg { color: #2563eb; } .gd.female svg { color: #d6457a; } .gd.other svg { color: var(--ink-2); }
  .abt3 .sep { height: 1px; background: var(--line); margin: 0.875rem 0; }

  /* ---- round 4: equal-height top row, salary ribbon, full-width experience / education / skills ---- */
  .abt3.eq { align-items: stretch; }
  .abt3.eq > .card { height: 100%; }
  .stackfull { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
  .stackfull .card { border-radius: 1rem; }
  .stackfull h3 { font-size: var(--fs-lg); font-weight: 650; }
  .eb.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .eb.c6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 1180px) { .eb.c6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .eb.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .eb.c6, .eb.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tag-ok.bad { background: var(--bad-soft); color: var(--bad); }
  .sal { position: relative; }
  .hikerib { position: absolute; top: 0.875rem; right: -0.375rem; padding: 0.25rem 0.6875rem 0.25rem 0.8125rem; background: var(--good); color: #fff; font-size: var(--fs-sm); font-weight: 700; border-radius: 0.375rem 0 0 0.375rem; box-shadow: 0 0.125rem 0.375rem color-mix(in srgb, #000 16%, transparent); z-index: 2; }
  .hikerib::after { content: ""; position: absolute; right: 0; top: 100%; border-top: 0.375rem solid color-mix(in srgb, var(--good) 55%, #000); border-right: 0.375rem solid transparent; }
  .sg2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.875rem 1.25rem; }
  .sal .pcf small { margin-bottom: 0.1875rem; }
  .sal .pcf b { font-size: var(--fs-md); }
  .sal .note { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.875rem; font-size: var(--fs-sm); color: var(--ink-3); }
  .loi { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  /* experience summary row inside the Experience card */
  .career { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr); gap: 0.875rem 1.5rem; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .career small { display: block; color: var(--ink-3); font-size: var(--fs-xs); margin-bottom: 0.1875rem; }
  .career b { font-weight: 600; font-size: var(--fs-md); }
  @media (max-width: 900px) { .career { grid-template-columns: 1fr 1fr; } .career > div:last-child { grid-column: 1 / -1; } }

  /* ---- AI summary block ---- */
  .aisum2 { --lc: var(--brand); display: flex; align-items: center; gap: 1.25rem; padding: 1rem 1.25rem 1rem 1.125rem; border-radius: 1rem; background: linear-gradient(100deg, color-mix(in srgb, var(--lc) 10%, var(--surface)), color-mix(in srgb, var(--lc) 3%, var(--surface)) 70%); border: 1px solid color-mix(in srgb, var(--lc) 18%, var(--surface)); box-shadow: inset 3px 0 0 var(--lc); }
  .aisum2.lv-hi { --lc: var(--good); } .aisum2.lv-mid { --lc: var(--brand); } .aisum2.lv-lo { --lc: var(--warn); }
  .ai-l { display: flex; flex-direction: column; align-items: center; gap: 0.3125rem; flex: none; }
  .ai-l .mring { width: 3.75rem; height: 3.75rem; }
  .ai-l .mring::before { width: 2.9375rem; height: 2.9375rem; font-size: var(--fs-sm); }
  .ai-l small { font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .ai-m { min-width: 0; flex: 1 1 auto; }
  .ai-h { display: flex; align-items: center; gap: 0.5625rem; margin-bottom: 0.3125rem; }
  .ai-ic { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--lc); color: #fff; display: grid; place-items: center; flex: none; }
  .ai-ic svg.i { width: 0.8125rem; height: 0.8125rem; }
  .ai-h b { font-size: var(--fs-md); font-weight: 650; }
  .ai-pill { padding: 0.125rem 0.6875rem; border-radius: 6.1875rem; background: color-mix(in srgb, var(--lc) 15%, var(--surface)); color: var(--lc); font-size: var(--fs-xs); font-weight: 700; }
  .aisum2 p { font-size: var(--fs-md); line-height: 1.55; color: var(--ink); }
  .ai-chips { display: flex; flex-wrap: wrap; gap: 0.4375rem; margin-top: 0.6875rem; }
  .ai-chips span { display: inline-flex; align-items: center; gap: 0.375rem; height: 1.625rem; padding: 0 0.6875rem; border-radius: 6.1875rem; font-size: var(--fs-sm); font-weight: 550; background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); }
  .ai-chips svg.i { width: 0.8125rem; height: 0.8125rem; }
  .ai-chips .ok { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .ai-chips .warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .ai-chips .no { border-style: dashed; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-3) 60%, transparent); }
  @media (max-width: 720px) { .aisum2 { flex-direction: column; align-items: flex-start; } }

  /* ---- AI summary: plain text, no badges ---- */
  .aisum3 .ai3-h { display: flex; align-items: center; gap: 0.4375rem; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.3125rem; }
  .aisum3 .ai3-h svg.i { width: 0.875rem; height: 0.875rem; color: var(--brand); }
  .aisum3 .ai3-h span { font-weight: 500; letter-spacing: 0.02em; text-transform: none; }
  .aisum3 p { font-size: var(--fs-md); line-height: 1.6; color: var(--ink); }

  /* ---- Hide details / Show details (same idea as the pipeline page) ---- */
  .pwrap { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.35s ease, opacity 0.25s ease; }
  .pwrap-in { overflow: hidden; min-height: 0; }
  .pwrap.min { grid-template-rows: 0fr; opacity: 0; }
  .pwrap.min + .tabs { margin-top: 0 !important; }
  .xbtn.on { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

  /* previous / next candidate (same control as the pipeline page) */
  .flip { display: inline-flex; align-items: center; gap: 0.125rem; border: 1px solid var(--line); border-radius: 6.1875rem; padding: 0.125rem; background: var(--surface); }

    return '<div class="card"><div class="card-head"><h3>Interviews</h3><div class="right"><button class="btn sm primary">' + icon("plus", "sm") + 'Schedule</button></div></div>' + (list.length ? list.map(function (i) { return '<div class="list-item"><div class="date-tile"><b>' + dayOf(i.date) + '</b><small>' + monOf(i.date) + '</small></div><div class="grow"><b>' + i.round + '</b><div class="muted">' + i.time + ' · ' + i.dur + ' · ' + i.mode + '</div></div>' + avatarStack(i.who, "") + chip(i.status, i.status === "Scheduled" ? "info" : i.status === "Completed" ? "good" : i.status === "Cancelled" ? "bad" : "warn", true) + '</div>'; }).join("") : '<div class="empty">No interviews scheduled yet.</div>') + '</div>';
  };

  views["Skill Zone"] = function () {
    var zones = DEMO.skillZones.filter(function (z) { return z.cands.indexOf(c.id) >= 0; });
    return '<div class="card"><div class="card-head"><h3>Skill zones<small>Talent pools this candidate belongs to</small></h3><div class="right"><button class="btn sm primary">' + icon("plus", "sm") + 'Add to zone</button></div></div>' + (zones.length ? zones.map(function (z) { return '<div class="list-item"><span class="ico" style="width:2.25rem;height:2.25rem;border-radius:0.625rem;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center">' + icon("spark", "sm") + '</span><div class="grow"><b>' + z.name + '</b><div class="muted">' + z.note + '</div></div><span class="faint">' + z.cands.length + ' people</span></div>'; }).join("") : '<div class="empty">Not in any skill zone yet.</div>') + '</div>';
  };

  var order = ["applied", "initial", "test", "interview", "offer", "hired"];
  var counts = { "Documents": 3, "Mail Log": 3, "Scheduled Interviews": DEMO.interviews.filter(function (i) { return i.cand === c.id; }).length };
  page.innerHTML = header + '<div class="tabs" id="tabs" style="margin-top:1.25rem">' + TABS.map(function (t, i) { return '<button class="tab' + (i === 0 ? " on" : "") + '" data-t="' + t + '">' + t + (counts[t] ? ' <span class="n">' + counts[t] + '</span>' : "") + '</button>'; }).join("") + '</div><div id="pane"></div>';

  function show(t) {
    document.getElementById("pane").innerHTML = views[t]();
    [].forEach.call(document.querySelectorAll("#tabs .tab"), function (b) { b.classList.toggle("on", b.dataset.t === t); });
    if (t === "Rating") {
      var cur = 0, box = document.getElementById("rate");
      var paint = function (n) { box.innerHTML = [1, 2, 3, 4, 5].map(function (i) { return '<button class="btn sm icon ghost" data-r="' + i + '" aria-label="' + i + ' stars"><span class="stars">' + icon(i <= n ? "starFill" : "star", "lg" + (i <= n ? "" : " e")) + '</span></button>'; }).join(""); };
      paint(0);
      box.addEventListener("click", function (e) { var b = e.target.closest("[data-r]"); if (b) { cur = +b.dataset.r; paint(cur); } });
      document.getElementById("saveRate").addEventListener("click", function () { toast("Rating saved (demo only)"); });
    }
  }
  document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-t]"); if (b) { show(b.dataset.t); } });
  show("About");

  /* actions */
  setTimeout(function () {
    var st = document.getElementById("status");
    st.addEventListener("click", function () {
      openModal({ title: "Update status", body: '<label class="lbl">Move ' + c.name + ' to</label><select class="select">' + DEMO.stages.map(function (s) { return '<option' + (s.id === c.stage ? " selected" : "") + '>' + s.label + '</option>'; }).join("") + '</select><label class="lbl" style="margin-top:0.875rem">Comment</label><textarea class="textarea" placeholder="Optional, kept in the stage history"></textarea>', foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Update</button>' });
    });
    document.getElementById("pane").addEventListener("click", function (e) {
      if (!e.target.closest("#neg")) { return; }
      c.negotiable = !c.negotiable; toast(c.negotiable ? "Marked open for negotiation" : "Marked not open for negotiation"); show("About");
    });
    document.getElementById("prevCand").addEventListener("click", function () { go("candidate-profile.html?id=" + prevC.id); });
    document.getElementById("nextCand").addEventListener("click", function () { go("candidate-profile.html?id=" + nextC.id); });
    var mb = document.getElementById("minBtn"), wrap = document.getElementById("pwrap");
    mb.addEventListener("click", function () {
      var hide = !wrap.classList.contains("min");
      wrap.classList.toggle("min", hide); try { localStorage.setItem("ariel-prof-min", hide ? "1" : "0"); } catch (x) {}
      mb.querySelector(".xl").textContent = hide ? "Show details" : "Hide details"; mb.setAttribute("aria-label", hide ? "Show details" : "Hide details"); mb.setAttribute("aria-pressed", hide);
      fitX(document.getElementById("head-actions"));
    });
    document.getElementById("edit").addEventListener("click", function () { toast("Edit form opens here (demo)"); });
    document.getElementById("track").addEventListener("click", function () { toast("Opens the candidate's own tracking link (demo)"); });
  }, 0);
})();
</script>
<script src="js/shell.js"></script>
<script>fitX();</script>
</body>
</html>
