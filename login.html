<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Ariel HR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  :root { --font-ui: "Sora", "Segoe UI", system-ui, sans-serif; }
  html { font-size: 100%; }
  body { min-height: 100vh; background: var(--surface); }
  .lg { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); min-height: 100vh; padding: 0.75rem; gap: 0.75rem; }

  /* left: company photo */
  .ph { position: relative; border-radius: 1.25rem; overflow: hidden; background: var(--surface-3); min-height: 24rem; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
  .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10, 18, 34, .78), rgba(10, 18, 34, 0) 55%); }
  .cap { position: absolute; z-index: 1; left: 2rem; right: 2rem; bottom: 1.75rem; color: #fff; }
  .cap small { display: block; font-size: var(--fs-xs); letter-spacing: 0.14em; text-transform: uppercase; opacity: .8; margin-bottom: 0.5rem; }
  .cap h2 { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; max-width: 24ch; }
  .cap p { margin-top: 0.5rem; color: rgba(255,255,255,.82); max-width: 44ch; }

  /* right: plain form column */
  .lf { display: flex; flex-direction: column; padding: 1.5rem 2.5rem; }
  .lf main { flex: 1; display: grid; place-items: center; }
  .box { width: min(23rem, 100%); }
  .mark { height: 2.75rem; width: auto; margin: 0 0 2.25rem; }
  .box h1 { font-size: 1.9rem; letter-spacing: -0.03em; line-height: 1.15; }
  .box .sub { color: var(--ink-2); margin: 0.5rem 0 1.75rem; }
  .fld { margin-bottom: 1rem; }
  .fld label { display: block; font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); margin-bottom: 0.375rem; }
  .fld .rowl { display: flex; justify-content: space-between; align-items: baseline; }
  .fld .rowl a { font-size: var(--fs-sm); }
  .in { width: 100%; height: 2.75rem; border: 1px solid var(--line); border-radius: 0.625rem; padding: 0 0.875rem; background: var(--surface); font-size: 0.95rem; outline: none; transition: border-color .15s, box-shadow .15s; }
  .in:hover { border-color: var(--ink-3); }
  .in:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .pw { position: relative; } .pw .in { padding-right: 2.75rem; }
  .eye { position: absolute; right: 0.375rem; top: 50%; transform: translateY(-50%); width: 2rem; height: 2rem; border: 0; background: none; border-radius: 0.5rem; color: var(--ink-3); display: grid; place-items: center; }
  .eye:hover { background: var(--surface-2); color: var(--ink); }
  .eye svg { width: 1.125rem; height: 1.125rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .fld.err .in { border-color: var(--bad); } .err-t { display: none; color: var(--bad); font-size: var(--fs-sm); margin-top: 0.375rem; } .fld.err .err-t { display: block; }
  .go { width: 100%; height: 2.75rem; border: 0; border-radius: 0.625rem; background: var(--brand); color: var(--brand-ink); font-weight: 600; font-size: 0.95rem; margin-top: 0.5rem; transition: background .15s; }
  .go:hover { background: var(--brand-strong); } .go:disabled { opacity: .7; cursor: progress; }
  .lf footer { color: var(--ink-3); font-size: var(--fs-xs); display: flex; justify-content: space-between; gap: 1rem; }

  /* background art on the form side */
  .lf { position: relative; overflow: hidden; background: #fbfcfe; border-radius: 1.25rem; }
  .lf > * { position: relative; z-index: 1; }
  .art { position: absolute !important; inset: 0; z-index: 0 !important; pointer-events: none; }
  .art svg { position: absolute; width: 100%; height: 100%; }

  /* floating-label inputs */
  .fld { position: relative; margin-bottom: 1rem; }
  .fld label { position: absolute; left: 0.75rem; top: 0.9375rem; margin: 0; padding: 0 0.3125rem; font-size: 0.9rem; color: var(--ink-3); font-weight: 400; pointer-events: none; background: #fff; line-height: 1.1; transition: top .15s, font-size .15s, color .15s; }
  .in { height: 3rem; padding: 0 0.875rem; background: #fff; }
  .in::placeholder { color: transparent; }
  .in:focus + label, .fld.has label { top: -0.5rem; font-size: 0.72rem; font-weight: 500; }
  .in:focus + label { color: var(--brand); }
  .fld.has:not(:focus-within) label { color: var(--ink-2); }
  .fld .rowl { display: flex; justify-content: flex-end; margin-top: 0.375rem; }
  .pw .in { padding-right: 2.75rem; }

  @media (max-width: 900px) { .lg { grid-template-columns: 1fr; padding: 0; gap: 0; } .ph { display: none; } .lf { padding: 1.25rem; } }
</style>
</head>
<body>
<div class="lg">
  <aside class="ph">
    <img src="assets/team.jpg" alt="The Ariel Software Solutions team">
    <div class="cap"><small>Ariel Software Solutions</small><h2>One place for your people, from hiring to exit.</h2><p>Recruitment, onboarding, attendance, payroll and more, all in one workspace.</p></div>
  </aside>
  <section class="lf">
    <div class="art" aria-hidden="true"><svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" fill="none">
      <defs><radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1d6fe8" stop-opacity=".16"/><stop offset="1" stop-color="#1d6fe8" stop-opacity="0"/></radialGradient>
      <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6552d0" stop-opacity=".12"/><stop offset="1" stop-color="#6552d0" stop-opacity="0"/></radialGradient>
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#c6cfdc"/></pattern>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="600" height="800" fill="url(#fade)"/></mask></defs>
      <circle cx="560" cy="60" r="260" fill="url(#g1)"/><circle cx="20" cy="780" r="260" fill="url(#g2)"/>
      <rect width="600" height="800" fill="url(#dots)" mask="url(#m)"/>
      <g stroke="#1d6fe8" stroke-opacity=".14" stroke-width="1.2"><circle cx="600" cy="0" r="120"/><circle cx="600" cy="0" r="190"/><circle cx="600" cy="0" r="260"/><circle cx="600" cy="0" r="330"/></g>
      <g stroke="#6552d0" stroke-opacity=".12" stroke-width="1.2"><circle cx="0" cy="800" r="110"/><circle cx="0" cy="800" r="180"/><circle cx="0" cy="800" r="250"/></g>
    </svg></div>
    <main>
      <form class="box" id="f" novalidate>
        <img class="mark" src="assets/ariel-logo.webp" alt="Ariel Software Solutions">
        <h1>Welcome back</h1>
        <p class="sub">Sign in to your Ariel HR account.</p>
        <div class="fld" data-f="u"><input class="in" id="u" autocomplete="username" placeholder=" "><label for="u">Username</label><div class="err-t">Enter your username.</div></div>
        <div class="fld" data-f="p"><div class="pw"><input class="in" id="p" type="password" autocomplete="current-password" placeholder=" "><label for="p">Password</label><button class="eye" type="button" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <div class="err-t">Enter your password.</div><div class="rowl"><a href="#" id="forgot">Forgot password?</a></div></div>
        <button class="go" id="go">Sign in</button>
      </form>
    </main>
    <footer><span>&copy; Ariel Software Solutions</span><span>Ariel HR</span></footer>
  </section>
</div>
<script>
  var f = document.getElementById("f"), u = document.getElementById("u"), p = document.getElementById("p");
  document.getElementById("eye").onclick = function () { var s = p.type === "password"; p.type = s ? "text" : "password"; this.setAttribute("aria-label", s ? "Hide password" : "Show password"); };
  [u, p].forEach(function (el) { var sync = function () { el.closest(".fld").classList.toggle("has", !!el.value); }; el.addEventListener("input", function () { el.closest(".fld").classList.remove("err"); sync(); }); el.addEventListener("change", sync); sync(); });
  document.getElementById("forgot").onclick = function (e) { e.preventDefault(); };
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var bad = false;
    [u, p].forEach(function (el) { var empty = !el.value.trim(); el.closest(".fld").classList.toggle("err", empty); if (empty && !bad) { bad = true; el.focus(); } });
    if (bad) return;
    var b = document.getElementById("go"); b.disabled = true; b.textContent = "Signing in...";
    setTimeout(function () { location.href = "recruitment-dashboard.html"; }, 700);
  });
</script>
</body>
</html>
