<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interviews</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.625rem; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.625rem; min-height: 9.375rem; }
  .day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .day h4 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-bottom: 0.5rem; display: flex; gap: 0.375rem; align-items: baseline; }
  .day h4 b { font-size: 1.1rem; color: var(--ink); letter-spacing: 0; }
  .slot { background: var(--brand-soft); border-left: 0.1875rem solid var(--brand); border-radius: 0.375rem; padding: 0.375rem 0.5rem; margin-bottom: 0.375rem; font-size: var(--fs-xs); }
  .slot b { display: block; font-size: var(--fs-sm); }
  .slot.warn { background: var(--warn-soft); border-color: var(--warn); }
  .slot.bad { background: var(--bad-soft); border-color: var(--bad); opacity: 0.8; }
  .slot.good { background: var(--good-soft); border-color: var(--good); }
  @media (max-width: 800px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body data-module="recruitment" data-page="interviews" data-title="Interview">
<main id="page">
  <div data-actions>
    <button class="btn" id="cal">Connect calendar</button>
    <button class="btn primary" id="new"><span data-i="plus"></span>Schedule interview</button>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="card-head"><h3>This week<small>Monday 5 Oct to Sunday 11 Oct 2026</small></h3></div>
    <div class="week" id="week"></div>
  </div>

  <div class="toolbar"><div class="filters" id="filters"></div></div>
  <div class="card flush"><div class="table-wrap"><table class="tbl" id="tbl"></table></div></div>
</main>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  [].forEach.call(document.querySelectorAll("[data-i]"), function (n) { n.outerHTML = icon(n.dataset.i, n.dataset.c); });
  var I = DEMO.interviews.map(function (i) { return i.status === "Feedback pending" ? Object.assign({}, i, { status: "Completed" }) : i; }), DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var tone = { Scheduled: "info", Completed: "good", Cancelled: "bad", "Feedback pending": "warn" };
  var cls = { Scheduled: "", Completed: "good", Cancelled: "bad", "Feedback pending": "warn" };

  var html = "";
  for (var d = 0; d < 7; d++) {
    var iso = "2026-10-" + (d + 5 < 10 ? "0" : "") + (d + 5);
    var items = I.filter(function (i) { return i.date === iso; }).sort(function (a, b) { return a.time < b.time ? -1 : 1; });
    html += '<div class="day' + (iso === DEMO.today ? " today" : "") + '"><h4>' + DAYS[d] + ' <b>' + (d + 5) + '</b></h4>' +
      (items.map(function (i) { return '<div class="slot ' + cls[i.status] + '"><b>' + i.time + ' · ' + DEMO.cand(i.cand).name.split(" ")[0] + '</b>' + i.round + '</div>'; }).join("") || '<span class="faint" style="font-size:var(--fs-xs)">Free</span>') + '</div>';
  }
  document.getElementById("week").innerHTML = html;

  var state = "All";
  function draw() {
    var list = I.filter(function (i) { return state === "All" || i.status === state; });
    document.getElementById("tbl").innerHTML = '<thead><tr><th>Candidate</th><th>Round</th><th>When</th><th>Mode</th><th>Interviewers</th><th>Status</th><th></th></tr></thead><tbody>' +
      list.map(function (i) {
        var c = DEMO.cand(i.cand);
        return '<tr><td><a href="candidate-profile.html?id=' + c.id + '" style="color:inherit;text-decoration:none">' + person(c.name, DEMO.job(c.job).title) + '</a></td><td>' + i.round + '</td><td><b>' + shortDate(i.date) + '</b> <span class="muted">' + i.time + ' · ' + i.dur + '</span></td><td>' + (i.mode === "Video call" ? icon("video", "sm") + " " : "") + i.mode + '</td><td>' + avatarStack(i.who) + '</td><td>' + chip(i.status, tone[i.status], true) + '</td><td class="act">' + '<button class="btn sm icon ghost" aria-label="More">' + icon("more", "sm") + '</button>' + '</td></tr>';
      }).join("") + '</tbody>';
  }
  var statuses = ["All", "Scheduled", "Completed", "Cancelled"];
  function drawFilters() { document.getElementById("filters").innerHTML = statuses.map(function (s) { var n = s === "All" ? I.length : I.filter(function (i) { return i.status === s; }).length; return '<button class="fchip' + (state === s ? " on" : "") + '" data-s="' + s + '">' + s + ' <span class="n">' + n + '</span></button>'; }).join(""); }
  document.getElementById("filters").addEventListener("click", function (e) { var b = e.target.closest("[data-s]"); if (b) { state = b.dataset.s; drawFilters(); draw(); } });
  document.getElementById("cal").addEventListener("click", function () { toast("Calendar sync is not part of this prototype"); });
  document.getElementById("new").addEventListener("click", function () {
    openModal({ title: "Schedule interview", wide: true, body: '<div class="form-grid"><div class="full"><label class="lbl">Candidate</label><select class="select">' + DEMO.candidates.filter(function (c) { return c.stage === "test" || c.stage === "interview" || c.stage === "initial"; }).map(function (c) { return "<option>" + c.name + "</option>"; }).join("") + '</select></div><div><label class="lbl">Date</label><input class="input" type="date" value="2026-10-12"></div><div><label class="lbl">Time</label><input class="input" type="time" value="11:00"></div><div><label class="lbl">Round</label><input class="input" placeholder="Technical round 1"></div><div><label class="lbl">Mode</label><select class="select"><option>Video call</option><option>On-site</option><option>Phone</option></select></div><div class="full"><label class="lbl">Interviewers</label><select class="select" multiple style="height:6rem">' + DEMO.team.map(function (t) { return "<option>" + t + "</option>"; }).join("") + '</select></div></div>', foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Send invites</button>' });
  });
  drawFilters(); draw();
})();
</script>
<script src="js/shell.js"></script>
</body>
</html>
