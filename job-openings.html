<body data-module="recruitment" data-page="job-openings" data-title="Job Openings" data-sub="" data-ruled="1">
<main id="page">
  <!-- heading row, right side: search, filter, view, export, new. Each is an icon that widens on hover. -->
  <div data-actions>
    <label class="xsearch" id="xs"><span data-i="search"></span><input id="q" type="search" placeholder="Search openings" aria-label="Search openings"></label>
    <button class="xbtn" id="filterBtn" aria-label="Filter openings"><span data-i="filter"></span><span class="xl" id="filterLbl">All jobs</span></button>
    <button class="xbtn" id="viewBtn" aria-label="Switch view"><span id="viewIco"></span><span class="xl" id="viewLbl">Table view</span></button>
    <button class="xbtn" id="exportBtn" aria-label="Export"><span data-i="download"></span><span class="xl">Export</span></button>
    <button class="xbtn" id="create" aria-label="New opening"><span data-i="plus"></span><span class="xl">New opening</span></button>
  </div>

  <div id="out" class="jobs"></div>
</main>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var state = { f: "open", q: "", v: "cards" };
  [].forEach.call(document.querySelectorAll("[data-i]"), function (n) { n.outerHTML = icon(n.dataset.i, n.dataset.c); });

  var FILTERS = [["open", "Open jobs"], ["closed", "Closed jobs"], ["all", "All jobs"], ["archived", "Archived"]];
  function liveJobs() { return DEMO.jobs.filter(function (j) { return !j.archived; }); }
  var DEPTS = ["Development", "Designing", "Human Resource", "Accounts", "Business Development"];
  function counts() { var l = liveJobs(); return { all: l.length, open: l.filter(function (j) { return j.status === "open"; }).length, closed: l.filter(function (j) { return j.status === "closed"; }).length, archived: DEMO.jobs.length - l.length }; }
  function rows() {
    return DEMO.jobs.filter(function (j) {
      var hay = (j.title + " " + j.dept + " " + j.skills.join(" ")).toLowerCase();
      var inView = state.f === "archived" ? !!j.archived : (!j.archived && (state.f === "all" || j.status === state.f));
      return inView && (!state.q || hay.indexOf(state.q) >= 0);
    });
  }
  var DEPT_COLOR = { "Development": "#2563eb", "Designing": "#7c4dff", "Human Resource": "#0d9488", "Accounts": "#ea7a1a", "Business Development": "#d6457a" };
  function deptColor(d) { return DEPT_COLOR[d] || "var(--brand)"; }
  function daysLeft(j) { return Math.round((new Date(j.end) - new Date(DEMO.today)) / 86400000); }
  function whenText(j) {
    if (j.status === "closed") { return { t: "Closed " + shortDate(j.end), soon: false }; }
    var n = daysLeft(j);
    if (n < 0) { return { t: "Past its closing date", soon: true }; }
    if (n === 0) { return { t: "Closes today", soon: true }; }
    return { t: "Closes in " + n + " day" + (n === 1 ? "" : "s"), soon: n <= 14 };
  }
  /* interviewers: everyone who sits on an interview for this opening (falls back to its managers) */
  /* LinkedIn "in" mark (brand blue) */
  function liIcon(cls) {
    return '<svg class="li ' + (cls || "") + '" viewBox="0 0 24 24" role="img" aria-label="Also posted on LinkedIn"><title>Also posted on LinkedIn</title><path fill="#0a66c2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
  }
  function interviewers(j) {
    var ids = DEMO.candidates.filter(function (c) { return c.job === j.id; }).map(function (c) { return c.id; }), seen = {}, out = [];
    DEMO.interviews.forEach(function (i) { if (ids.indexOf(i.cand) >= 0) { i.who.forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } }); } });
    return out.length ? out : j.managers.slice();
  }
  /* round, overlapping avatars (first five, then +n). Cards get a name tooltip; the table uses the browser's own. */

    var slug = j.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    var make = function (src) { return "https://careers.arielsoftware.in/apply/" + j.id + "-" + slug + "?source=" + src.toLowerCase(); };
    var m = openModal({ title: "Create dynamic link", body: '<p class="muted" style="font-size:var(--fs-sm);margin-bottom:0.875rem">Anyone who applies through this link is tagged with the source you pick.</p><div class="form-grid"><div class="full"><label class="lbl">Source</label><select class="select" id="dlSrc">' + sources.map(function (x) { return "<option>" + x + "</option>"; }).join("") + '</select></div><div class="full"><label class="lbl">Link</label><input class="input" id="dlUrl" readonly value="' + make(sources[0]) + '"></div></div>', foot: '<button class="btn" data-close>Close</button><button class="btn primary" id="dlCopy">' + icon("copy", "sm") + "Copy link</button>" });
    m.querySelector("#dlSrc").addEventListener("change", function () { m.querySelector("#dlUrl").value = make(this.value); });
    m.querySelector("#dlCopy").addEventListener("click", function () {
      var url = m.querySelector("#dlUrl"); url.select();
      var done = function () { toast("Link copied"); };
      var fallback = function () { var ok = false; try { ok = document.execCommand("copy"); } catch (y) {} if (ok) { done(); } else { toast("Press Ctrl+C to copy the selected link"); } };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url.value).then(done, fallback); } else { fallback(); }
    });
  }

  /* ---- Delete: always asks first ---- */
  function confirmDelete(j, drawerToClose) {
    var m = openModal({ title: "Delete this opening?", body: '<p><b>' + j.title + '</b> will be removed from the list. Its ' + applicants(j) + ' candidates are kept and stay in the Candidates page.</p>', foot: '<button class="btn" data-close>Cancel</button><button class="btn bad" data-close id="yes">Delete opening</button>' });
    m.querySelector("#yes").addEventListener("click", function () {
      DEMO.jobs = DEMO.jobs.filter(function (x) { return x.id !== j.id; });
      if (drawerToClose) { drawerToClose.close(); }
      refresh(); toast("Opening deleted (demo only)");
    });
  }

  /* ---- clicks on cards and rows ---- */
  var out = document.getElementById("out");
  out.addEventListener("click", function (e) {
    var mb = e.target.closest("[data-menu]");
    if (mb) {
      e.stopPropagation();
      if (menuAnchor === mb) { closeMenu(); return; }
      var j = jobById(mb.dataset.menu);
      openMenu(mb, '<button class="item" data-pick="edit">' + icon("edit", "sm") + 'Edit</button>' +
        '<button class="item" data-pick="duplicate">' + icon("copy", "sm") + 'Duplicate</button>' +
        '<button class="item" data-pick="link">' + icon("link", "sm") + 'Create dynamic link</button>' +
        '<button class="item" data-pick="archive">' + icon(j.archived ? "refresh" : "inbox", "sm") + (j.archived ? "Unarchive" : "Archive") + '</button>' +
        '<div class="sep"></div><button class="item danger" data-pick="delete">' + icon("trash", "sm") + 'Delete</button>', function (v) {
        if (v === "edit") { editDrawer(j); }
        if (v === "duplicate") { duplicateJob(j); }
        if (v === "link") { linkModal(j); }
        if (v === "archive") { j.archived = !j.archived; toast(j.archived ? "Archived. Find it under Filter, Archived." : "Moved back to your openings"); refresh(); }
        if (v === "delete") { confirmDelete(j); }
      }, 0, "compact");
      return;
    }
    if (e.target.closest("[data-new]")) { newDrawer(); return; }
    var host = e.target.closest("[data-id]"); if (host && !e.target.closest("a")) { go("pipeline.html?job=" + host.dataset.id); }   // a card or row opens that job's pipeline
  });
  out.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.classList.contains("job-card")) { go("pipeline.html?job=" + e.target.dataset.id); } });

  /* ---- heading tools ---- */
  var xs = document.getElementById("xs"), q = document.getElementById("q");
  xs.addEventListener("click", function () { q.focus(); });
  q.addEventListener("input", function () { state.q = q.value.toLowerCase(); xs.classList.toggle("has", !!q.value); draw(); });
  document.getElementById("viewBtn").addEventListener("click", function () { state.v = state.v === "cards" ? "table" : "cards"; refresh(); });
  document.getElementById("filterBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    if (menuAnchor === this) { closeMenu(); return; }
    var c = counts();
    openMenu(this, '<h4>Show</h4>' + FILTERS.map(function (f) { return '<button class="item' + (state.f === f[0] ? " on" : "") + '" data-pick="' + f[0] + '">' + f[1] + '<span class="tail">' + c[f[0]] + '</span></button>'; }).join(""), function (v) { state.f = v; refresh(); }, 200);
  });
  document.getElementById("exportBtn").addEventListener("click", function () { toast("Exported " + rows().length + " openings (demo only)"); });
  document.getElementById("create").addEventListener("click", newDrawer);

  refresh();
  window.addEventListener("load", syncSummary);   // the header is built by shell.js, after this script
})();
</script>
<script src="js/shell.js"></script>
<script>fitX();</script>
</body>
</html>
