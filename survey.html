<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Survey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .split { display: grid; grid-template-columns: 18.75rem minmax(0, 1fr); gap: var(--gap); align-items: start; }
  @media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .tpl { display: block; width: 100%; text-align: left; padding: 0.75rem 0.875rem; border-radius: 0.625rem; border: 1px solid transparent; background: transparent; }
  .tpl:hover { background: var(--surface-2); }
  .tpl.on { background: var(--brand-soft); border-color: var(--brand); }
  .q { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; gap: 0.75rem; align-items: start; padding: 0.875rem; border: 1px solid var(--line); border-radius: 0.75rem; margin-bottom: 0.625rem; background: var(--surface); }
  .q .no { width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-xs); }
  .opt-list { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }
</style>
</head>
<body data-module="recruitment" data-page="survey" data-title="Recruitment Survey">
<main id="page">
  <div data-actions><button class="btn primary" id="new"><span data-i="plus"></span>New template</button></div>
  <div class="split">
    <div class="card" style="padding:0.625rem"><div class="card-head" style="padding:0.5rem 0.625rem 0"><h3>Templates</h3></div><div id="list"></div></div>
    <div id="detail"></div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  [].forEach.call(document.querySelectorAll("[data-i]"), function (n) { n.outerHTML = icon(n.dataset.i, n.dataset.c); });
  var sel = 1;
  function list() {
    document.getElementById("list").innerHTML = DEMO.surveys.map(function (s) {
      return '<button class="tpl' + (s.id === sel ? " on" : "") + '" data-id="' + s.id + '"><b>' + s.name + '</b><div class="muted" style="font-size:var(--fs-xs)">' + s.questions.length + ' questions · used by ' + s.used + ' openings</div></button>';
    }).join("");
  }
  function detail() {
    var s = DEMO.surveys.filter(function (x) { return x.id === sel; })[0];
    document.getElementById("detail").innerHTML = '<div class="card"><div class="card-head"><h3>' + s.name + '<small>' + s.questions.length + ' questions · used by ' + s.used + ' openings</small></h3><div class="right"><button class="btn sm">' + icon("copy", "sm") + 'Duplicate</button><button class="btn sm">' + icon("edit", "sm") + 'Rename</button><button class="btn sm danger icon" aria-label="Delete">' + icon("trash", "sm") + '</button></div></div>' +
      s.questions.map(function (q, i) {
        return '<div class="q"><span class="no">' + (i + 1) + '</span><div><b>' + q.q + '</b><div class="muted" style="font-size:var(--fs-xs);margin-top:2px">' + q.type + '</div>' + (q.options ? '<div class="opt-list">' + q.options.map(function (o) { return '<span class="tag">' + o + '</span>'; }).join("") + '</div>' : "") + '</div><div class="row"><button class="btn sm icon ghost" aria-label="Edit">' + icon("edit", "sm") + '</button><button class="btn sm icon ghost" aria-label="Remove">' + icon("trash", "sm") + '</button></div></div>';
      }).join("") + '<button class="btn" id="addq" style="width:100%;border-style:dashed">' + icon("plus") + 'Add question</button></div>';
    document.getElementById("addq").addEventListener("click", function () {
      openModal({ title: "Add question", body: '<div class="form-grid"><div class="full"><label class="lbl">Question <span class="req">*</span></label><input class="input"></div><div><label class="lbl">Answer type</label><select class="select"><option>Short text</option><option>Long text</option><option>Single choice</option><option>Multiple choice</option><option>Yes / No</option><option>Number</option><option>Rating (1 to 5)</option></select></div><label class="row" style="align-self:end"><span class="switch"><input type="checkbox"><span></span></span>Required</label><div class="full"><label class="lbl">Choices</label><input class="input" placeholder="Separate choices with commas"><div class="hint">Only used for single and multiple choice.</div></div></div>', foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Add question</button>' });
    });
  }
  document.getElementById("list").addEventListener("click", function (e) { var b = e.target.closest("[data-id]"); if (b) { sel = +b.dataset.id; list(); detail(); } });
  document.getElementById("new").addEventListener("click", function () { openModal({ title: "New survey template", body: '<label class="lbl">Template name</label><input class="input" placeholder="For example, Phone screen">', foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Create</button>' }); });
  list(); detail();
})();
</script>
<script src="js/shell.js"></script>
</body>
</html>
