<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate Profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .doc { background: #fff; color: #222; border: 1px solid var(--line); border-radius: 0.5rem; padding: 2.125rem 2.5rem; max-width: 47.5rem; box-shadow: var(--shadow-sm); font-size: 0.86rem; }
  .doc h2 { font-size: 1.4rem; color: #111; margin-bottom: 2px; }
  .doc h4 { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.7rem; color: #666; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; margin: 1.25rem 0 0.5rem; }
  .doc p, .doc li { color: #333; margin-bottom: 0.25rem; }
  .doc ul { list-style: disc; padding-left: 1.125rem; }
  .reason li { display: flex; gap: 0.625rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .reason li:last-child { border: 0; }
  .reason .ico { width: 1.5rem; height: 1.5rem; border-radius: 0.4375rem; display: grid; place-items: center; flex: none; }
  .reason .ok { background: var(--good-soft); color: var(--good); }
  .reason .gap { background: var(--warn-soft); color: var(--warn); }
  .qa dt { font-weight: 600; margin-top: 0.875rem; }
  .qa dd { margin: 0.25rem 0 0; color: var(--ink-2); }
</style>
</head>
<body data-module="recruitment" data-page="candidates" data-title="Candidate" data-compact="1">
<main id="page"></main>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var id = +(qparam("id") || 1);
  var c = DEMO.cand(id) || DEMO.cand(1), job = DEMO.job(c.job);
  document.title = c.name + " - Candidate Profile";
  document.body.dataset.title = c.name;
  var page = document.getElementById("page");
  var h = hash(c.name);

  /* ---- header ---- */
  var order = ["applied", "initial", "test", "interview", "offer", "hired"];
  var at = order.indexOf(c.stage);
  var steps = order.map(function (s, i) { return '<div class="' + (c.stage === "cancelled" ? "" : i < at ? "done" : i === at ? "now" : "") + '">' + DEMO.stage(s).label + '</div>'; }).join("");
  var header =
    '<div data-actions><a class="btn" href="candidates.html">' + icon("left") + 'Back to candidates</a><button class="btn" id="edit">' + icon("edit") + 'Edit</button><button class="btn" id="track">' + icon("eye") + 'Candidate self tracking</button><button class="btn primary" id="status">Update status' + icon("down", "sm") + '</button></div>' +
    '<div class="card"><div class="profile-head">' + avatar(c.name, "lg") +
      '<div class="grow"><div class="row wrap"><h1>' + c.name + '</h1>' + stageChip(c.stage) + '</div>' +
        '<div class="muted" style="margin-top:2px">Applied for <b>' + job.title + '</b> · ' + job.dept + '</div>' +
        '<div class="profile-facts"><span>' + icon("mail", "sm") + c.email + '</span><span>' + icon("phone", "sm") + c.phone + '</span><span>' + icon("pin", "sm") + c.loc + '</span><span>' + icon("tag", "sm") + c.source + '</span><span>' + icon("calendar", "sm") + 'Applied ' + fmtDate(c.applied) + '</span></div></div>' +
      '<div class="row" style="gap:1.375rem"><div style="text-align:center"><div class="muted" style="font-size:var(--fs-xs);margin-bottom:0.25rem">AI match</div>' + ring(c.ai, true) + '</div><div style="text-align:center"><div class="muted" style="font-size:var(--fs-xs);margin-bottom:0.375rem">Rating</div>' + (c.rating ? stars(c.rating) : '<span class="faint">Not rated</span>') + '</div></div></div>' +
      '<div class="pipeline-steps">' + steps + '</div></div>';

  /* ---- tabs ---- */
  var TABS = ["About", "AI Insights", "Resume", "Survey", "Documents", "History", "Rating", "Onboarding", "Mail Log", "Scheduled Interviews", "Skill Zone"];
  var views = {};

  views["About"] = function () {
    return '<div class="grid g2"><div class="card"><div class="card-head"><h3>Contact and application</h3></div><dl class="dl"><dt>Email</dt><dd>' + c.email + '</dd><dt>Mobile</dt><dd>' + c.phone + '</dd><dt>Location</dt><dd>' + c.loc + '</dd><dt>Job opening</dt><dd><a href="pipeline.html?job=' + job.id + '">' + job.title + '</a></dd><dt>Source</dt><dd>' + c.source + '</dd><dt>Applied on</dt><dd>' + fmtDate(c.applied) + '</dd><dt>Recruitment managers</dt><dd>' + avatarStack(job.managers, "xs") + ' <span class="muted">' + job.managers.join(", ") + '</span></dd></dl></div>' +
      '<div class="card"><div class="card-head"><h3>Professional details</h3></div><dl class="dl"><dt>Experience</dt><dd>' + c.exp + ' years</dd><dt>Notice period</dt><dd>' + c.notice + '</dd><dt>Current CTC</dt><dd>' + Math.round(parseFloat(c.ctc) * 0.82) + ' LPA</dd><dt>Expected CTC</dt><dd>' + c.ctc + '</dd><dt>Skills</dt><dd><div class="tags">' + c.skills.map(function (s) { return '<span class="tag">' + s + '</span>'; }).join("") + '</div></dd></dl></div>' +
      '<div class="card" style="grid-column:1/-1"><div class="card-head"><h3>Recruiter notes</h3><div class="right"><button class="btn sm">' + icon("plus", "sm") + 'Add note</button></div></div><div class="list-item">' + avatar("Sonali Thakur", "") + '<div class="grow"><b>Sonali Thakur</b> <span class="faint">· 2 days ago</span><div class="muted">Good communication in the screening call. Confirmed the notice period can be shortened if the offer is quick.</div></div></div></div></div>';
  };

  views["AI Insights"] = function () {
    var others = DEMO.jobs.filter(function (j) { return j.id !== job.id && j.status === "open"; }).slice(0, 3).map(function (j, i) { return { j: j, s: Math.max(40, c.ai - 12 - i * 9 - (h % 7)) }; });
    return '<div class="grid g-main"><div class="card"><div class="card-head"><h3>Why this score<small>Read from the resume by the local AI model</small></h3><div class="right"><button class="btn sm">' + icon("spark", "sm") + 'Score again</button></div></div>' +
      '<ul class="reason">' + c.skills.slice(0, 3).map(function (s) { return '<li><span class="ico ok">' + icon("check", "sm") + '</span><div><b>' + s + '</b><div class="muted">Appears in recent roles and matches the opening.</div></div></li>'; }).join("") +
      '<li><span class="ico ok">' + icon("check", "sm") + '</span><div><b>' + c.exp + ' years of experience</b><div class="muted">Opening asks for ' + job.exp + '.</div></div></li>' +
      '<li><span class="ico gap">' + icon("flag", "sm") + '</span><div><b>Gap: ' + (job.skills[job.skills.length - 1]) + '</b><div class="muted">Not mentioned on the resume. Worth a question in the interview.</div></div></li></ul>' +
      '<div class="callout ai" style="margin-top:0.875rem">' + icon("spark") + '<div>Scores support the decision, they never move a candidate on their own. Confidence on this resume: <b>' + (h % 12 + 84) + '%</b>.</div></div></div>' +
      '<div class="card"><div class="card-head"><h3>Other openings that fit</h3></div>' + others.map(function (o) { return '<div class="list-item">' + ring(o.s) + '<div class="grow"><b>' + o.j.title + '</b><div class="muted">' + o.j.dept + '</div></div><button class="btn sm">Suggest</button></div>'; }).join("") + '</div></div>';
  };

  views["Resume"] = function () {
    return '<div class="card"><div class="card-head"><h3>' + c.name.replace(/ /g, "_") + '_Resume.pdf<small>Uploaded ' + fmtDate(c.applied) + ' · 218 KB</small></h3><div class="right"><button class="btn sm">' + icon("download", "sm") + 'Download</button><button class="btn sm">' + icon("eye", "sm") + 'Full screen</button></div></div>' +
      '<div class="doc"><h2>' + c.name + '</h2><p>' + c.loc + ' · ' + c.email + ' · ' + c.phone + '</p><h4>Summary</h4><p>' + c.exp + ' years building and shipping production software. Comfortable owning a feature from design to release and mentoring juniors.</p>' +
      '<h4>Experience</h4><p><b>Senior engineer</b>, Northwind Technologies &nbsp; <span style="color:#777">2022 - Present</span></p><ul><li>Led a team of four on a customer platform used by 40,000 people.</li><li>Cut average response time by 38% by reworking the data layer.</li></ul><p><b>Software engineer</b>, Finserve Labs &nbsp; <span style="color:#777">2019 - 2022</span></p><ul><li>Built internal tools that replaced three manual reporting processes.</li></ul>' +
      '<h4>Skills</h4><p>' + c.skills.join(" · ") + '</p><h4>Education</h4><p>B.Tech, Computer Science, 2018</p></div></div>';
  };

  views["Survey"] = function () {
    var s = DEMO.surveys[0];
    var ans = ["" + c.exp + " years", "Docker, Celery, Redis", "Yes", "github.com/" + c.name.split(" ")[0].toLowerCase() + "-dev/portfolio"];
    return '<div class="card"><div class="card-head"><h3>' + s.name + '<small>Answered when applying on ' + fmtDate(c.applied) + '</small></h3>' + chip("Completed", "good", true) + '</div><dl class="qa">' + s.questions.map(function (q, i) { return '<dt>' + q.q + '</dt><dd>' + ans[i] + '</dd>'; }).join("") + '</dl></div>';
  };

  views["Documents"] = function () {
    var docs = [["Resume", c.name.replace(/ /g, "_") + "_Resume.pdf", "218 KB", c.applied], ["ID proof", "Aadhaar_masked.pdf", "96 KB", c.applied], ["Education certificate", "BTech_degree.pdf", "410 KB", c.applied]];
    if (c.stage === "offer" || c.stage === "hired") { docs.push(["Offer letter", "Offer_" + c.name.split(" ")[0] + ".pdf", "134 KB", "2026-10-08"]); }
    return '<div class="card flush"><div class="card-head" style="padding:1.125rem 1.25rem 0"><h3>Documents</h3><div class="right"><button class="btn sm primary">' + icon("upload", "sm") + 'Upload</button></div></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Type</th><th>File</th><th>Size</th><th>Added</th><th></th></tr></thead><tbody>' +
      docs.map(function (d) { return '<tr><td><b>' + d[0] + '</b></td><td><span class="row">' + icon("file", "sm") + d[1] + '</span></td><td>' + d[2] + '</td><td>' + fmtDate(d[3]) + '</td><td class="act"><button class="btn sm icon ghost" aria-label="Download">' + icon("download", "sm") + '</button><button class="btn sm icon ghost" aria-label="Delete">' + icon("trash", "sm") + '</button></td></tr>'; }).join("") + '</tbody></table></div></div>';
  };

  views["History"] = function () {
    var ev = [["Applied through " + c.source, c.applied, "muted", "System"]];
    var idx = order.indexOf(c.stage);
    for (var i = 1; i <= idx; i++) { ev.push(["Moved to " + DEMO.stage(order[i]).label, "2026-10-0" + Math.min(9, i + 2), i === idx && c.stage === "hired" ? "good" : "", job.managers[0]]); }
    if (c.stage === "cancelled") { ev.push(["Marked as cancelled", "2026-10-02", "bad", job.managers[0]]); }
    ev.push(["AI resume score added: " + c.ai, c.applied, "muted", "AI assistant"]);
    ev.reverse();
    return '<div class="card"><div class="card-head"><h3>Stage history</h3></div><div class="timeline">' + ev.map(function (e) { return '<div class="tl ' + e[2] + '"><b>' + e[0] + '</b><small>' + fmtDate(e[1]) + ' · ' + e[3] + '</small></div>'; }).join("") + '</div></div>';
  };

  views["Rating"] = function () {
    var r = c.rating || 0;
    return '<div class="grid g-main"><div class="card"><div class="card-head"><h3>Ratings from the team</h3></div>' + (r ? job.managers.map(function (m, i) { return '<div class="list-item">' + avatar(m, "") + '<div class="grow"><b>' + m + '</b><div class="muted">' + ["Clear thinker, explains trade-offs well.", "Strong fundamentals, a little light on testing."][i % 2] + '</div></div>' + stars(Math.max(1, r - i)) + '</div>'; }).join("") : '<div class="empty">Nobody has rated this candidate yet.</div>') + '</div>' +
      '<div class="card"><div class="card-head"><h3>Your rating</h3></div><div class="stack"><div id="rate" class="row" style="gap:0.25rem"></div><textarea class="textarea" placeholder="Add a short comment"></textarea><button class="btn primary" id="saveRate">Save rating</button></div></div></div>';
  };

  views["Onboarding"] = function () {
    if (c.stage !== "hired") { return '<div class="card empty">' + icon("userplus", "lg") + '<p style="margin-top:0.5rem"><b>Onboarding starts once the candidate is hired.</b></p><p>Tasks from the onboarding template will appear here.</p></div>'; }
    var t = [["Collect signed offer letter", "Done"], ["Create work email and accounts", "Done"], ["Issue laptop and access card", "In progress"], ["Schedule orientation", "Pending"], ["Assign a buddy", "Pending"]];
    return '<div class="card flush"><div class="card-head" style="padding:1.125rem 1.25rem 0"><h3>Onboarding tasks</h3></div><table class="tbl"><thead><tr><th>Task</th><th>Status</th><th>Modified by</th></tr></thead><tbody>' + t.map(function (x) { return '<tr><td>' + x[0] + '</td><td>' + chip(x[1], x[1] === "Done" ? "good" : x[1] === "In progress" ? "warn" : "", true) + '</td><td>' + person("Krishan Murari", "", "xs") + '</td></tr>'; }).join("") + '</tbody></table></div>';
  };

  views["Mail Log"] = function () {
    var mails = [["Application received", c.applied], ["Invitation: screening call", "2026-10-02"], ["Interview scheduled", "2026-10-06"]];
    return '<div class="card flush"><div class="card-head" style="padding:1.125rem 1.25rem 0"><h3>Mail log</h3><div class="right"><button class="btn sm primary">' + icon("send", "sm") + 'Send mail</button></div></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Subject</th><th>To</th><th>Sent</th><th>Status</th></tr></thead><tbody>' + mails.map(function (m) { return '<tr><td><b>' + m[0] + '</b></td><td>' + c.email + '</td><td>' + fmtDate(m[1]) + '</td><td>' + chip("Delivered", "good", true) + '</td></tr>'; }).join("") + '</tbody></table></div></div>';
  };

  views["Scheduled Interviews"] = function () {
    var list = DEMO.interviews.filter(function (i) { return i.cand === c.id; });
    return '<div class="card"><div class="card-head"><h3>Interviews</h3><div class="right"><button class="btn sm primary">' + icon("plus", "sm") + 'Schedule</button></div></div>' + (list.length ? list.map(function (i) { return '<div class="list-item"><div class="date-tile"><b>' + dayOf(i.date) + '</b><small>' + monOf(i.date) + '</small></div><div class="grow"><b>' + i.round + '</b><div class="muted">' + i.time + ' · ' + i.dur + ' · ' + i.mode + '</div></div>' + avatarStack(i.who, "") + chip(i.status, i.status === "Scheduled" ? "info" : i.status === "Completed" ? "good" : i.status === "Cancelled" ? "bad" : "warn", true) + '</div>'; }).join("") : '<div class="empty">No interviews scheduled yet.</div>') + '</div>';
  };

  views["Skill Zone"] = function () {
    var zones = DEMO.skillZones.filter(function (z) { return z.cands.indexOf(c.id) >= 0; });
    return '<div class="card"><div class="card-head"><h3>Skill zones<small>Talent pools this candidate belongs to</small></h3><div class="right"><button class="btn sm primary">' + icon("plus", "sm") + 'Add to zone</button></div></div>' + (zones.length ? zones.map(function (z) { return '<div class="list-item"><span class="ico" style="width:2.25rem;height:2.25rem;border-radius:0.625rem;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center">' + icon("spark", "sm") + '</span><div class="grow"><b>' + z.name + '</b><div class="muted">' + z.note + '</div></div><span class="faint">' + z.cands.length + ' people</span></div>'; }).join("") : '<div class="empty">Not in any skill zone yet.</div>') + '</div>';
  };

  var counts = { "Documents": 3, "Mail Log": 3, "Scheduled Interviews": DEMO.interviews.filter(function (i) { return i.cand === c.id; }).length };
  page.innerHTML = header + '<div class="tabs" id="tabs" style="margin-top:1.25rem">' + TABS.map(function (t, i) { return '<button class="tab' + (i === 0 ? " on" : "") + '" data-t="' + t + '">' + t + (counts[t] ? ' <span class="n">' + counts[t] + '</span>' : "") + '</button>'; }).join("") + '</div><div id="pane"></div>';

  function show(t) {
    document.getElementById("pane").innerHTML = views[t]();
    [].forEach.call(document.querySelectorAll("#tabs .tab"), function (b) { b.classList.toggle("on", b.dataset.t === t); });
    if (t === "Rating") {
      var cur = 0, box = document.getElementById("rate");
      var paint = function (n) { box.innerHTML = [1, 2, 3, 4, 5].map(function (i) { return '<button class="btn sm icon ghost" data-r="' + i + '" aria-label="' + i + ' stars"><span class="stars">' + icon(i <= n ? "starFill" : "star", "lg" + (i <= n ? "" : " e")) + '</span></button>'; }).join(""); };
      paint(0);
      box.addEventListener("click", function (e) { var b = e.target.closest("[data-r]"); if (b) { cur = +b.dataset.r; paint(cur); } });
      document.getElementById("saveRate").addEventListener("click", function () { toast("Rating saved (demo only)"); });
    }
  }
  document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-t]"); if (b) { show(b.dataset.t); } });
  show("About");

  /* actions */
  setTimeout(function () {
    var st = document.getElementById("status");
    st.addEventListener("click", function () {
      openModal({ title: "Update status", body: '<label class="lbl">Move ' + c.name + ' to</label><select class="select">' + DEMO.stages.map(function (s) { return '<option' + (s.id === c.stage ? " selected" : "") + '>' + s.label + '</option>'; }).join("") + '</select><label class="lbl" style="margin-top:0.875rem">Comment</label><textarea class="textarea" placeholder="Optional, kept in the stage history"></textarea>', foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Update</button>' });
    });
    document.getElementById("edit").addEventListener("click", function () { toast("Edit form opens here (demo)"); });
    document.getElementById("track").addEventListener("click", function () { toast("Opens the candidate's own tracking link (demo)"); });
  }, 0);
})();
</script>
<script src="js/shell.js"></script>
</body>
</html>
